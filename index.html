function pageKegiatan(){
  const u = state.ctxUnit;
  const fStatus = FILTER.kgStatus || 'aktif';
  let list = DB.kegiatan.filter(k=>k.unit===u);
  if(fStatus === 'aktif')   list = list.filter(k=>!k.selesai);
  if(fStatus === 'selesai') list = list.filter(k=>k.selesai);
  list.sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? 1 : -1);
  const rows = list.map((k,i)=>{
    const baySiswa = kegiatanPemasukanSiswa(k.id);
    const masukLain = kegiatanTransMasuk(k.id);
    const keluar = kegiatanTransKeluar(k.id);
    const saldo = baySiswa + masukLain - keluar;
    const target = Number(k.target)||0;
    const persen = target > 0 ? Math.min(100, Math.round(baySiswa / target * 100)) : 0;
    const kelasList = kegiatanKelasList(k);
    const kelasLabel = kelasList.map(t=>'Kelas '+t).join(', ') || '-';
    const isSelesai = !!k.selesai;
    const bisaSelesaikan = !isSelesai && saldo === 0 && !!(baySiswa + masukLain);
    return `<tr>
      <td class="c">${i+1}</td>
      <td class="c no-print"><button class="btn xs primary" onclick="bukaKegiatan('${k.id}')">Kelola</button></td>
      <td><strong>${esc(k.nama)}</strong> ${isSelesai?'<span class="badge selesai">Selesai</span>':''}<br><small style="color:#94a3b8">${esc(k.keterangan||'')}</small></td>
      <td>${fmtTgl(k.tanggal)}</td>
      <td><small>${esc(kelasLabel)}</small></td>
      <td class="r">${rp(k.biayaPerSiswa||0)}</td>
      <td class="r masuk">${rp(baySiswa)}</td>
      <td class="r">${target>0?persen+'%':'—'}</td>
      <td class="r ${saldo>=0?'masuk':'keluar'}"><strong>${rp(saldo)}</strong></td>
      <td class="c no-print">
        ${!isSelesai
          ? `<button class="btn xs success" onclick="selesaikanKegiatan('${k.id}')" ${bisaSelesaikan?'':'disabled'} title="${bisaSelesaikan?'Selesaikan kegiatan':'Saldo harus Rp 0'}">✓ Selesaikan</button>
             <button class="btn xs danger" onclick="hapusKegiatan('${k.id}')">Hapus</button>`
          : `<button class="btn xs danger" onclick="hapusKegiatan('${k.id}')">Hapus</button>`}
      </td>
    </tr>`;
  }).join('');
  return `
  <div class="card no-print">
    <h3>📚 Kegiatan Siswa
      <span class="h3-actions">
        <button class="btn sm primary" onclick="formTambahKegiatan()">➕ Buat Kegiatan</button>
      </span>
    </h3>
    <div class="filters">
      <div><label>Status</label>
        <select onchange="setFilter('kgStatus',this.value)">
          <option value="aktif"   ${fStatus==='aktif'?'selected':''}>Aktif</option>
          <option value="selesai" ${fStatus==='selesai'?'selected':''}>Selesai</option>
          <option value="semua"   ${fStatus==='semua'?'selected':''}>Semua</option>
        </select></div>
    </div>
    <div class="info-box">
      ℹ️ Kelola kegiatan yang membutuhkan pembayaran siswa. Tombol <strong>✓ Selesaikan</strong> aktif saat <strong>saldo = Rp 0</strong>.
    </div>
  </div>
  <div class="card"><h3>Daftar Kegiatan (${list.length})</h3>
    ${list.length ? `<div class="tbl-wrap"><table class="tbl">
      <thead><tr>
        <th class="c" style="width:40px">No</th><th class="c no-print">Kelola</th>
        <th>Nama Kegiatan</th><th>Tanggal</th><th>Kelas</th>
        <th class="r">Biaya/Siswa</th><th class="r">Bayar Siswa</th><th class="r">Progres</th><th class="r">Saldo</th>
        <th class="c no-print">Aksi</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>` : `<div class="empty">Belum ada kegiatan.</div>`}
  </div>`;
}

    <div class="form-row"><label>Keterangan</label>
      <input id="kgKet" value="${kg?esc(kg.keterangan||''):''}"></div>
    <div class="form-actions">
      <button class="btn primary" onclick="simpanKegiatan('${editId||''}')">💾 Simpan</button>

function simpanKegiatan(editId){
  const u = state.ctxUnit;
  const nama = document.getElementById('kgNama').value.trim();
  if(!nama){ toast('Nama kegiatan wajib','error'); return; }
  const kelasList = Array.from(document.querySelectorAll('.kgKelasChk:checked')).map(c=>c.value);
  if(!kelasList.length){ toast('Pilih minimal 1 kelas','error'); return; }
  const data = {
    nama,
    tanggal: document.getElementById('kgTanggal').value || todayStr(),
    kelasList,
    biayaPerSiswa: Number(document.getElementById('kgBiaya').value)||0,
    target: Number(document.getElementById('kgTarget').value)||0,
    keterangan: document.getElementById('kgKet').value.trim()
  };
  if(editId){
    const kg = DB.kegiatan.find(k=>k.id===editId);
    if(!kg){ toast('Kegiatan tidak ditemukan','error'); return; }
    if(kg.selesai){ toast('Kegiatan sudah selesai','error'); return; }
    Object.assign(kg, data);
    toast('Kegiatan diperbarui','ok');
  } else {
    DB.kegiatan.push({ id: uid(), unit: u, ...data, selesai:false, selesaiAt:'', createdAt: Date.now() });
    toast('Kegiatan dibuat','ok');
  }
  saveDB(); closeModal(); render();
}
function hapusKegiatan(id){
  if(!confirm('Hapus kegiatan + semua transaksi & pembayaran terkait?')) return;
  const refIds = DB.kegiatanTrans.filter(t=>t.kegiatanId===id && t.refId).map(t=>t.refId);
  DB.transaksi = DB.transaksi.filter(t=>!refIds.includes(t.refId));
  DB.kegiatan = DB.kegiatan.filter(k=>k.id!==id);
  DB.kegiatanTrans = DB.kegiatanTrans.filter(t=>t.kegiatanId!==id);
  DB.kegiatanPembayaran = DB.kegiatanPembayaran.filter(p=>p.kegiatanId!==id);
  saveDB(); toast('Dihapus','ok'); render();
}
function bukaKegiatan(id){
  state.kegiatanId = id;
  state.kegiatanView = 'ringkasan';
  state.page = 'kegiatanDetail';
  render();
}
function selesaikanKegiatan(id){
  const kg = DB.kegiatan.find(k=>k.id===id);
  if(!kg){ toast('Kegiatan tidak ditemukan','error'); return; }
  if(kg.selesai){ toast('Sudah selesai','error'); return; }
  const saldo = saldoKegiatan(id);
  if(saldo !== 0){ toast('Saldo harus Rp 0 untuk diselesaikan (saat ini ' + rp(saldo) + ')','error'); return; }
  if(!confirm(`Selesaikan kegiatan "${kg.nama}"? Setelah selesai tidak dapat diubah lagi.`)) return;
  kg.selesai = true;
  kg.selesaiAt = todayStr();
  saveDB(); toast('✓ Kegiatan diselesaikan','ok'); render();
}
function pageKegiatanDetail(){

  const tabList = [

    { id:'dana',       label:'🔄 Dana Sekolah' }
  ];
  const tabsHtml = `<div class="tabs no-print">

  </div>`;
  const kelasList = kegiatanKelasList(kg);

  const saldo = saldoKegiatan(kg.id);
  const headerHtml = `
  <div class="card">

        ${!isSelesai
          ? `<button class="btn sm primary" onclick="formTambahKegiatan('${kg.id}')">✎ Edit Info</button>
             <button class="btn sm success" onclick="selesaikanKegiatan('${kg.id}')" ${saldo===0?'':'disabled'} title="${saldo===0?'Selesaikan kegiatan':'Saldo harus Rp 0'}">✓ Selesaikan Kegiatan</button>`
          : ''}
      </span>
    </h3>
    <div style="font-size:12.5px;color:#64748b;margin-bottom:10px">
      ${fmtTgl(kg.tanggal)} &middot; Kelas: <strong>${esc(kelasLabel)}</strong> &middot; Biaya/Siswa: <strong>${rp(kg.biayaPerSiswa||0)}</strong>
      ${kg.target ? `&middot; Target: <strong>${rp(kg.target)}</strong>` : ''}
      ${kg.keterangan ? `<br>${esc(kg.keterangan)}` : ''}
    </div>
    <div class="cards" style="margin-bottom:0">
      <div class="stat green"><span>Bayar Siswa</span><strong>${rp(kegiatanPemasukanSiswa(kg.id))}</strong></div>

      <div class="stat red"><span>Pengeluaran</span><strong>${rp(kegiatanTransKeluar(kg.id))}</strong></div>
      <div class="stat amber"><span>Saldo Kegiatan</span><strong>${rp(saldo)}</strong></div>
    </div>
  </div>`;
  let contentHtml = '';

  return headerHtml + tabsHtml + contentHtml;
}
function viewKegiatanRingkasan(kg){
  const masukLain = DB.kegiatanTrans.filter(t=>t.kegiatanId===kg.id && t.jenis==='masuk').sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? -1 : 1);
  const keluar = DB.kegiatanTrans.filter(t=>t.kegiatanId===kg.id && t.jenis==='keluar').sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? -1 : 1);
  const bayarSiswa = DB.kegiatanPembayaran.filter(p=>p.kegiatanId===kg.id).sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? -1 : 1);
  const last = [];
  masukLain.forEach(t=>last.push({ t:t.tanggal, j:'masuk-lain', k:t.keterangan||'Pemasukan', v:t.jumlah }));
  keluar.forEach(t=>last.push({ t:t.tanggal, j:'keluar', k:t.keterangan||'Pengeluaran', v:t.jumlah }));
  bayarSiswa.forEach(p=>{
    const s = DB.siswa.find(x=>x.id===p.siswaId);
    last.push({ t:p.tanggal, j:'bayar', k:'Bayar: '+(s?s.nama:'-'), v:p.jumlah });
  });
  last.sort((a,b)=> (a.t||'') < (b.t||'') ? 1 : -1);
  const rows = last.slice(0,30).map((x,i)=>{
    const jenisLabel = x.j==='keluar' ? '<span class="badge no">Keluar</span>'
      : (x.j==='bayar' ? '<span class="badge info">Bayar Siswa</span>' : '<span class="badge ok">Masuk</span>');
    const cls = x.j==='keluar' ? 'keluar' : 'masuk';
    return `<tr>
      <td class="c">${i+1}</td>
      <td>${fmtTgl(x.t)}</td>
      <td>${jenisLabel}</td>
      <td>${esc(x.k)}</td>
      <td class="r ${cls}">${rp(x.v)}</td>
    </tr>`;
  }).join('');
  return `
  <div class="card"><h3>📜 Aktivitas Terbaru</h3>
    ${rows ? `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th class="c" style="width:40px">No</th><th>Tanggal</th><th>Jenis</th><th>Keterangan</th><th class="r">Jumlah</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>` : `<div class="empty">Belum ada aktivitas.</div>`}
  </div>`;
}

function viewKegiatanRekap(kg){
  const u = state.ctxUnit;
  const kelasList = kegiatanKelasList(kg);
  const fKelas = FILTER.kgRekapKelas || '';
  let list = DB.siswa.filter(s=>s.unit===u && kelasList.includes(s.tingkat));
  if(fKelas && kelasList.includes(fKelas)) list = list.filter(s=>s.tingkat===fKelas);
  list.sort((a,b)=> (a.tingkat+'').localeCompare(b.tingkat+'') || a.nama.localeCompare(b.nama));
  const biaya = Number(kg.biayaPerSiswa)||0;
  const isSelesai = !!kg.selesai;
  const rows = list.map((s,i)=>{
    const bay = totalBayarKegiatanSiswa(kg.id, s.id);
    const tunggakan = Math.max(0, biaya - bay);
    const persen = biaya>0 ? Math.min(100, Math.round(bay/biaya*100)) : 0;
    const status = (biaya>0 && tunggakan<=0) ? '<span class="badge ok">Lunas</span>'
                  : (bay>0 ? '<span class="badge pending">Kurang</span>'
                  : (biaya>0 ? '<span class="badge no">Belum</span>' : '<span class="badge info">—</span>'));
    return `<tr>
      <td class="c">${i+1}</td>
      <td>${esc(s.nis)}</td>
      <td><strong>${esc(s.nama)}</strong></td>
      <td class="c">${esc(s.tingkat)}</td>
      <td class="r">${rp(biaya)}</td>

function expKegiatanRekap(kgId){
  const kg = DB.kegiatan.find(k=>k.id===kgId); if(!kg) return;
  const u = state.ctxUnit;
  const kelasList = kegiatanKelasList(kg);
  const fKelas = FILTER.kgRekapKelas || '';
  let list = DB.siswa.filter(s=>s.unit===u && kelasList.includes(s.tingkat));
  if(fKelas && kelasList.includes(fKelas)) list = list.filter(s=>s.tingkat===fKelas);
  list.sort((a,b)=> (a.tingkat+'').localeCompare(b.tingkat+'') || a.nama.localeCompare(b.nama));
  const biaya = Number(kg.biayaPerSiswa)||0;
  const rows = list.map((s,i)=>{
    const bay = totalBayarKegiatanSiswa(kg.id, s.id);
    const tunggakan = Math.max(0, biaya-bay);
    return [i+1, s.nis, s.nama, s.tingkat, biaya, bay, tunggakan, biaya>0&&bay>=biaya?'Lunas':(bay>0?'Kurang':'Belum')];
  });
  exportExcel('rekap_kegiatan_'+(kg.nama||'').replace(/\s+/g,'_'),
    ['No','NIS','Nama','Tingkat','Tagihan','Dibayar','Tunggakan','Status'], rows);
}
function cetakKegiatanRekap(kgId){
  const kg = DB.kegiatan.find(k=>k.id===kgId); if(!kg) return;
  const u = state.ctxUnit;
  const kelasList = kegiatanKelasList(kg);
  const fKelas = FILTER.kgRekapKelas || '';
  let list = DB.siswa.filter(s=>s.unit===u && kelasList.includes(s.tingkat));
  if(fKelas && kelasList.includes(fKelas)) list = list.filter(s=>s.tingkat===fKelas);
  list.sort((a,b)=> (a.tingkat+'').localeCompare(b.tingkat+'') || a.nama.localeCompare(b.nama));
  const biaya = Number(kg.biayaPerSiswa)||0;
  const rows = list.map((s,i)=>{
    const bay = totalBayarKegiatanSiswa(kg.id, s.id);
    const tunggakan = Math.max(0, biaya-bay);
    return [i+1, s.nis, s.nama, s.tingkat, rp(biaya), rp(bay), rp(tunggakan)];
  });
  const totTag = list.length * biaya;

    ['No','NIS','Nama','Tingkat','Tagihan','Dibayar','Tunggakan'], rows,

}

function simpanProgram(editId){
  const u = state.ctxUnit;
  const nama = document.getElementById('evNama').value.trim();

  const data = {
    nama,
    tanggal: document.getElementById('evTanggal').value || todayStr(),
    target: Number(document.getElementById('evTarget').value)||0,
    keterangan: document.getElementById('evKet').value.trim()
  };

    toast('Program diperbarui','ok');
  } else {
    DB.events.push({ id:uid(), unit:u, ...data, selesai:false, selesaiAt:'', bendahara:'', bendaharaUsername:'', createdAt: Date.now() });

function hapusEvent(id){
  const ev = DB.events.find(e=>e.id===id);
  if(ev && ev.selesai){
    if(!confirm('Program ini sudah selesai. Hapus permanen + semua transaksinya?')) return;
  } else if(!confirm('Hapus program + transaksinya?')) return;
  const refIds = DB.eventTrans.filter(t=>t.eventId===id).map(t=>t.refId).filter(Boolean);
  DB.transaksi = DB.transaksi.filter(t=>!refIds.includes(t.refId));
  DB.events = DB.events.filter(e=>e.id!==id);
  DB.eventTrans = DB.eventTrans.filter(t=>t.eventId!==id);
  DB.permohonan = DB.permohonan.filter(p=>p.eventId!==id);
  /* Hapus juga user bendahara_program yang terkait */
  const toRemove = Object.entries(DB.users).filter(([un, info])=>
    info.role === 'bendahara_program' && info.programId === id
  ).map(([un])=>un);
  toRemove.forEach(un=> delete DB.users[un]);
  saveDB(); saveUsers(); toast('Dihapus','ok'); render();
}

function simpanBendaharaProgram(evId){
  const ev = DB.events.find(e=>e.id===evId); if(!ev) return;
  const username = document.getElementById('bpUsername').value.trim().toLowerCase();
  const nama = document.getElementById('bpNama').value.trim();
  const pass = document.getElementById('bpPass').value;
  const pass2 = document.getElementById('bpPass2').value;
  if(!username || !/^[a-z0-9_.]+$/.test(username)){ toast('Username tidak valid','error'); return; }
  if(DB.users[username]){ toast('Username sudah dipakai','error'); return; }
  if(!nama){ toast('Nama wajib','error'); return; }
  if(pass.length < 3){ toast('Password min 3 karakter','error'); return; }
  if(pass !== pass2){ toast('Konfirmasi password tidak sama','error'); return; }
  /* Simpan user baru */
  DB.users[username] = {
    pass, nama, role: 'bendahara_program',
    unit: ev.unit,
    programId: ev.id
  };
  /* Update juga field bendahara di event */
  if(!ev.bendahara) ev.bendahara = nama;
  if(!ev.bendaharaUsername) ev.bendaharaUsername = username;
  saveDB(); saveUsers();
  closeModal();
  toast('✓ Bendahara program ditambahkan','ok');
  render();
}
function hapusUserBendahara(username){
  const info = DB.users[username]; if(!info) return;
  if(!confirm(`Hapus bendahara program "${username}"? Akun login akan dihapus.`)) return;
  delete DB.users[username];
  saveUsers();
  toast('Dihapus','ok'); render();
}

function simpanEventTransProgram(evId){
  const ev = DB.events.find(e=>e.id===evId);
  if(!ev){ toast('Program tidak ditemukan','error'); return; }
  if(ev.selesai){ toast('Program sudah selesai','error'); return; }
  const tanggal = document.getElementById('eptTanggal').value || todayStr();
  const jenis = document.getElementById('eptJenis').value;
  const jumlah = Number(document.getElementById('eptJumlah').value)||0;
  const ket = document.getElementById('eptKet').value.trim();
  if(jumlah<=0){ toast('Jumlah tidak valid','error'); return; }
  DB.eventTrans.push({
    id:uid(), eventId:ev.id, unit:ev.unit,
    tanggal, jenis, jumlah,
    keterangan: ket || (jenis==='masuk'?'Donasi masuk':'Pengeluaran program')
  });
  saveDB(); closeModal(); toast('Transaksi disimpan','ok'); render();
}
function hapusEventTrans(id){
  const t = DB.eventTrans.find(x=>x.id===id); if(!t) return;
  const ev = DB.events.find(e=>e.id===t.eventId);
  if(ev && ev.selesai){ toast('Program sudah selesai','error'); return; }
  if(!confirm('Hapus?')) return;
  DB.eventTrans = DB.eventTrans.filter(t=>t.id!==id);
  saveDB(); toast('Dihapus','ok'); render();
}
function expEventTrans(){
  const ev = DB.events.find(x=>x.id===state.eventId); if(!ev) return;
  const trs = DB.eventTrans.filter(t=>t.eventId===ev.id);
  exportExcel('program_'+ev.nama.replace(/\s+/g,'_'), ['No','Tanggal','Jenis','Keterangan','Jumlah'],
    trs.map((t,i)=>[i+1, fmtTgl(t.tanggal), t.jenis==='masuk'?'Masuk':'Keluar', t.keterangan||'', Number(t.jumlah)]));
}
function cetakEventTrans(){
  const ev = DB.events.find(x=>x.id===state.eventId); if(!ev) return;
  const trs = DB.eventTrans.filter(t=>t.eventId===ev.id).sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? -1 : 1);
  const m = trs.filter(t=>t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);
  const k = trs.filter(t=>t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);
  cetakPDF('Laporan Program: ' + ev.nama, 'Tanggal: ' + fmtTgl(ev.tanggal),
    ['No','Tanggal','Jenis','Keterangan','Jumlah'],
    trs.map((t,i)=>[i+1, fmtTgl(t.tanggal), t.jenis==='masuk'?'Masuk':'Keluar', t.keterangan||'', rp(t.jumlah)]),
    ['','SALDO','','', rp(m-k)], ev.unit, { tanggal: ev.tanggal });
}
function formDanaEvent(jenis){
  const ev = DB.events.find(x=>x.id===state.eventId); if(!ev) return;
  if(ev.selesai){ toast('Program sudah selesai','error'); return; }
  const u = ev.unit;
  const saldo = saldoEvent(ev.id);
  const saldoKas = saldoUnit(u, tahunAktif(u));
  const judul = jenis === 'minta' ? labelAmbilKas(u) : labelSetorKas(u);
  const kasLabel = labelKasUnit(u);
  const defaultKet = jenis === 'minta' ? 'Ambil dana program: ' + ev.nama : 'Setor dana program: ' + ev.nama;
  const infoColor = jenis === 'minta' ? '#f59e0b' : '#16a34a';
  const infoText = jenis === 'minta'
    ? `Saldo ${kasLabel} akan <strong>berkurang</strong> dan saldo program <strong>bertambah</strong>.`
    : `Saldo ${kasLabel} akan <strong>bertambah</strong> dan saldo program <strong>berkurang</strong>.`;
  showModal(judul, `
    <div class="cards" style="margin-bottom:14px">
      <div class="stat"><span>Saldo Program</span><strong>${rp(saldo)}</strong></div>
      <div class="stat amber"><span>Saldo ${esc(kasLabel)}</span><strong>${rp(saldoKas)}</strong></div>
    </div>
    <div class="info-box" style="background:#fef3c7;border-left-color:${infoColor}">⚡ ${infoText}</div>
    <div class="form-row"><label>Jumlah (Rp)</label><input type="number" id="pmeJumlah" min="0" value=""></div>
    <div class="form-row"><label>Tanggal</label><input type="date" id="pmeTanggal" value="${todayStr()}"></div>
    <div class="form-row"><label>Keterangan</label><input id="pmeKet" placeholder="${esc(defaultKet)}"></div>
    <div class="form-actions">
      <button class="btn primary" onclick="kirimDanaEvent('${jenis}')">✓ Proses</button>
      <button class="btn ghost" onclick="closeModal()">Batal</button>
    </div>`);
}
function kirimDanaEvent(jenis){
  const ev = DB.events.find(x=>x.id===state.eventId); if(!ev) return;
  if(ev.selesai){ toast('Program sudah selesai','error'); return; }
  const u = ev.unit;
  const jumlah = Number(document.getElementById('pmeJumlah').value)||0;
  const tanggal = document.getElementById('pmeTanggal').value || todayStr();
  const ketUser = document.getElementById('pmeKet').value.trim();
  if(jumlah<=0){ toast('Jumlah tidak valid','error'); return; }
  const tahun = tahunDariTanggal(u, tanggal);
  if(!(DB.years[u]||[]).some(y=>y.tahun===tahun)){
    DB.years[u] = DB.years[u] || [];
    DB.years[u].push({ id:uid(), tahun, saldoAwal:0, aktif:false });
  }
  const kasLabel = labelKasUnit(u);
  const transRefId = 'ev-' + uid();
  if(jenis === 'minta'){
    const ket = ketUser || ('Ambil dana program: ' + ev.nama);
    tambahTransaksi(u, tahun, tanggal, 'keluar', 'Lain-lain', jumlah, ket, transRefId);
    DB.eventTrans.push({ id:uid(), eventId:ev.id, unit:u, tanggal, jenis:'masuk', jumlah, keterangan:'Ambil dari ' + kasLabel });
  } else {
    const ket = ketUser || ('Setor dana program: ' + ev.nama);
    tambahTransaksi(u, tahun, tanggal, 'masuk', 'Lain-lain', jumlah, ket, transRefId);
    DB.eventTrans.push({ id:uid(), eventId:ev.id, unit:u, tanggal, jenis:'keluar', jumlah, keterangan:'Setor ke ' + kasLabel });
  }
  saveDB(); closeModal();
  toast('✓ Berhasil: ' + (jenis==='minta' ? 'Ambil dari ' + kasLabel : 'Setor ke ' + kasLabel), 'ok');
  render();
}

    <td class="c"><span class="badge ${p.status==='approved'?'ok':'no'}">${p.status==='approved'?'Disetujui':'Ditolak'}</span></td>
    <td>${esc(p.approvedBy||'-')}</td>
  </tr>`).join('');
  const tMinta = pending.filter(p=>p.jenis==='minta').reduce((a,b)=>a+Number(b.jumlah),0);
  const tSetor = pending.filter(p=>p.jenis==='setor').reduce((a,b)=>a+Number(b.jumlah),0);
  return `

      <tbody>${rowsP}</tbody></table></div>` : `<div class="empty">Tidak ada pengajuan.</div>`}

  <div class="card"><h3>Riwayat Persetujuan</h3>
    ${riwayat.length ? `<div class="tbl-wrap"><table class="tbl">

      <tbody>${rowsR}</tbody></table></div>` : `<div class="empty">Belum ada.</div>`}
  </div>`;
}
function setujuiPermohonan(id){
  const p = DB.permohonan.find(x=>x.id===id);
  if(!p || p.status!=='pending') return;
  if(!confirm(`Setujui ${rp(p.jumlah)}?`)) return;
  const thY = tahunAktif('yayasan');
  const thU = tahunAktif(p.dari);
  const tgl = todayStr();
  const nmShort = shortUnitName(p.dari);
  const transRefId = 'pm-' + p.id;
  if(p.jenis === 'minta'){
    const ketY = keteranganDenganCatatan('Bantuan ' + nmShort.toLowerCase(), p.keterangan);
    tambahTransaksi('yayasan', thY, tgl, 'keluar', 'Bantuan Yayasan ke Unit', p.jumlah, ketY, transRefId);
    const ketU = keteranganDenganCatatan('Dana dari Yayasan', p.keterangan);
    tambahTransaksi(p.dari, thU, tgl, 'masuk', 'Bantuan Yayasan ke Unit', p.jumlah, ketU, transRefId);
  } else {
    const ketY = keteranganDenganCatatan('Setoran ' + nmShort.toLowerCase(), p.keterangan);
    tambahTransaksi('yayasan', thY, tgl, 'masuk', 'Setor Unit ke Yayasan', p.jumlah, ketY, transRefId);
    const ketU = keteranganDenganCatatan('Setoran ke Yayasan', p.keterangan);
    tambahTransaksi(p.dari, thU, tgl, 'keluar', 'Setor Unit ke Yayasan', p.jumlah, ketU, transRefId);
  }
  p.status = 'approved'; p.approvedAt = tgl; p.approvedBy = state.user.nama;
  saveDB(); toast('Disetujui','ok'); render();
}
function tolakPermohonan(id){
  const p = DB.permohonan.find(x=>x.id===id); if(!p) return;
  if(!confirm('Tolak?')) return;
  p.status = 'rejected'; p.approvedBy = state.user.nama; p.approvedAt = todayStr();
  saveDB(); toast('Ditolak','ok'); render();
}

function pageLaporan(){
  const u = state.ctxUnit;

    { v:'kas',      l:'Laporan Arus Kas (Detail)' },
    { v:'rekapkas', l:'Laporan Rekapitulasi Arus Kas' },
    { v:'kategori', l:'Laporan Rekap per Kategori' },
    { v:'keuangan', l:'Laporan Keuangan (Ringkasan)' },

  if(tipe === 'yayasan') jenisOpts.push({ v:'unit', l:'Rekap Saldo Seluruh Unit' });
  if(tipe === 'yayasan' && role !== 'jamaah') jenisOpts.push({ v:'pajak', l:'Laporan Pajak (SPT PPh Badan)' });
  if(tipe === 'mahad')   jenisOpts.push({ v:'siswa', l:'Laporan Pembayaran Siswa' });
  if(tipe === 'mahad')   jenisOpts.push({ v:'kegiatan', l:'Laporan Kegiatan Siswa' });
  const jenis = FILTER.lapJenis || 'kas';
  if(jenis === 'keuangan') return renderLaporanJenisSelector(jenisOpts, jenis) + pageLaporanKeuangan(u);
  if(jenis === 'pajak'){
    if(role === 'jamaah') return '<div class="card"><div class="empty">Akses ditolak.</div></div>';
    return renderLaporanJenisSelector(jenisOpts, jenis) + pageLaporanPajak(u);
  }

    ...(DB.years[u]||[]).map(y=>y.tahun),

        <select onchange="setFilter('lapTahun',this.value)">
          ${tahunList.map(t=>`<option value="${t}" ${t===th?'selected':''}>${esc(t)}</option>`).join('')}
        </select></div>
      <div><label>Periode</label>
        <select onchange="setFilter('lapBulan',this.value)">
          <option value="">Tahunan</option>
          ${BULAN.map((b,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${String(i+1).padStart(2,'0')===bl?'selected':''}>${b}</option>`).join('')}

    const periodeLbl = bl ? `${BULAN[Number(bl)-1]} ${th}` : `Tahun ${th}`;

    if(bl) data = data.filter(t=>(t.tanggal||'').slice(5,7)===bl);
    data.sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? -1 : 1);
    let sa = saldoAwal(u, th);
    if(bl){

      <h3>Laporan Arus Kas — ${esc(periodeLbl)}

  else if(jenis === 'kegiatan'){
    const kgs = DB.kegiatan.filter(k=>k.unit===u).sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? 1 : -1);

function hitungDataPajak(unit, tahun){
  const data = DB.transaksi.filter(t=>t.unit===unit && t.tahun===tahun);
  const katMasuk = {}, katKeluar = {};
  data.forEach(t=>{
    if(t.jenis==='masuk') katMasuk[t.kategori] = (katMasuk[t.kategori]||0) + Number(t.jumlah);
    else katKeluar[t.kategori] = (katKeluar[t.kategori]||0) + Number(t.jumlah);
  });
  const totalMasuk = Object.values(katMasuk).reduce((a,b)=>a+b,0);
  const totalKeluar = Object.values(katKeluar).reduce((a,b)=>a+b,0);
  const rincianMasuk = Object.entries(katMasuk)
    .map(([kat,jml])=>({ kategori:kat, jumlah:jml, objekPajak: !KATEGORI_BUKAN_OBJEK_PAJAK.includes(kat) }))
    .sort((a,b)=> (a.objekPajak===b.objekPajak) ? 0 : (a.objekPajak ? -1 : 1));
  const rincianKeluar = Object.entries(katKeluar).map(([kat,jml])=>({ kategori:kat, jumlah:jml })).sort((a,b)=> b.jumlah - a.jumlah);
  const penerimaanObjek = rincianMasuk.filter(r=>r.objekPajak).reduce((a,b)=>a+b.jumlah,0);
  const penerimaanNonObjek = totalMasuk - penerimaanObjek;
  const biayaFiskal = totalKeluar;
  const penghasilanNetoKomersial = totalMasuk - totalKeluar;
  const penghasilanNetoFiskal = Math.max(0, penerimaanObjek - biayaFiskal);
  const tarif = 0.22;
  const pphTerutang = penghasilanNetoFiskal * tarif;
  return { data, katMasuk, katKeluar, rincianMasuk, rincianKeluar, totalMasuk, totalKeluar, penerimaanObjek, penerimaanNonObjek, biayaFiskal, penghasilanNetoKomersial, penghasilanNetoFiskal, tarif, pphTerutang };
}

function expRekapKas(){

    ...ALL_UNITS.flatMap(un => (DB.years[un]||[]).map(y=>y.tahun)),
    ...DB.transaksi.map(t=>t.tahun),
    String(new Date().getFullYear())
  ])).sort();
  function hitungUnit(un){
    const thU = tahunUntukUnit(un, th);
    let data = DB.transaksi.filter(t=>t.unit===un && t.tahun===thU);
    if(bl) data = data.filter(t=>(t.tanggal||'').slice(5,7)===bl);
    const m = data.filter(t=>t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);
    const k = data.filter(t=>t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);
    let sa = saldoAwal(un, thU);
    if(bl){
      DB.transaksi.filter(t=>t.unit===un && t.tahun===thU && (t.tanggal||'').slice(5,7) < bl)
        .forEach(t=> sa += t.jenis==='masuk' ? Number(t.jumlah) : -Number(t.jumlah));
    }
    return { masuk:m, keluar:k, sa, akhir: sa+m-k, data, thU };
  }
  const hasil = ALL_UNITS.map(un => ({ un, ...hitungUnit(un) }));
  const tM = hasil.reduce((a,h)=>a+h.masuk,0);
  const tK = hasil.reduce((a,h)=>a+h.keluar,0);

          ${tahunList.map(t=>`<option value="${t}" ${t===th?'selected':''}>${esc(t)}</option>`).join('')}
        </select></div>
      <div><label>Periode</label>
        <select onchange="setFilter('lkBl',this.value)">
          <option value="">Tahunan</option>
          ${BULAN.map((b,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${String(i+1).padStart(2,'0')===bl?'selected':''}>${b}</option>`).join('')}
        </select></div>
      <div><label>Detail Unit</label>
        <select onchange="setFilter('lkUnit',this.value)">
          <option value="">— Ringkasan —</option>
          ${ALL_UNITS.map(un=>`<option value="${un}" ${un===detailUnit?'selected':''}>${esc(UNITS[un].nama)}</option>`).join('')}
        </select></div>
    </div>
    <div class="form-actions" style="margin-top:14px">
      <button class="btn sm" onclick="expLaporanKetua()">⬇ Excel</button>
      <button class="btn sm" onclick="cetakLaporanKetua()">🖨 Cetak</button>
    </div>
  </div>
  <div class="cards">
    <div class="stat purple"><span>Total Pemasukan</span><strong>${rp(tM)}</strong><small>${esc(periodeLbl)}</small></div>
    <div class="stat red"><span>Total Pengeluaran</span><strong>${rp(tK)}</strong></div>
    <div class="stat green"><span>Total Saldo Akhir</span><strong>${rp(tA)}</strong></div>
    <div class="stat amber"><span>Jumlah Transaksi</span><strong>${num(hasil.reduce((a,h)=>a+h.data.length,0))}</strong></div>
  </div>`;
  const rows = hasil.map((h,i)=>`<tr>
    <td class="c">${i+1}</td>
    <td><strong>${esc(UNITS[h.un].nama)}</strong></td>
    <td class="c">${esc(h.thU)}</td>
    <td class="r">${rp(h.sa)}</td>
    <td class="r masuk">${rp(h.masuk)}</td>
    <td class="r keluar">${rp(h.keluar)}</td>
    <td class="r"><strong>${rp(h.akhir)}</strong></td>
    <td class="c no-print"><button class="btn xs primary" onclick="setFilter('lkUnit','${h.un}')">Detail</button></td>
  </tr>`).join('');
  html += `<div class="card"><h3>Ringkasan — ${esc(periodeLbl)}</h3>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th class="c" style="width:40px">No</th><th>Unit</th><th class="c">Tahun</th><th class="r">Saldo Awal</th><th class="r">Masuk</th><th class="r">Keluar</th><th class="r">Saldo Akhir</th><th class="c no-print">Aksi</th></tr></thead>
      <tbody>${rows}<tr class="tot-row"><td class="c"></td><td colspan="2">TOTAL</td><td class="r">-</td><td class="r">${rp(tM)}</td><td class="r">${rp(tK)}</td><td class="r">${rp(tA)}</td><td class="no-print"></td></tr></tbody>
    </table></div>
  </div>`;
  if(detailUnit && UNITS[detailUnit]){
    const h = hasil.find(x=>x.un===detailUnit);
    const data = h.data.sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? -1 : 1);
    let running = h.sa;
    const detailRows = data.map((t,i)=>{
      running += t.jenis==='masuk' ? Number(t.jumlah) : -Number(t.jumlah);
      return `<tr><td class="c">${i+1}</td><td>${fmtTgl(t.tanggal)}</td><td>${esc(t.kategori)}</td><td>${esc(t.keterangan||'-')}</td>
        <td class="r masuk">${t.jenis==='masuk'?rp(t.jumlah):'-'}</td>
        <td class="r keluar">${t.jenis==='keluar'?rp(t.jumlah):'-'}</td>
        <td class="r"><strong>${rp(running)}</strong></td></tr>`;
    }).join('');
    html += `<div class="card">
      <h3>Detail — ${esc(UNITS[detailUnit].nama)} (${esc(h.thU)})
        <span class="h3-actions no-print">
          <button class="btn sm" onclick="setFilter('lkUnit','')">✕ Tutup</button>
          <button class="btn sm" onclick="expDetailUnit('${detailUnit}')">⬇ Excel</button>
          <button class="btn sm" onclick="cetakDetailUnit('${detailUnit}')">🖨 Cetak</button>
        </span>
      </h3>
      ${data.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th class="c" style="width:40px">No</th><th>Tgl</th><th>Kategori</th><th>Keterangan</th><th class="r">Masuk</th><th class="r">Keluar</th><th class="r">Saldo</th></tr></thead>
        <tbody>${detailRows}<tr class="tot-row"><td class="c"></td><td colspan="2">TOTAL</td><td></td>
          <td class="r masuk">${rp(h.masuk)}</td><td class="r keluar">${rp(h.keluar)}</td><td class="r">${rp(h.akhir)}</td></tr></tbody>
      </table></div>` : `<div class="empty">Tidak ada transaksi.</div>`}
    </div>`;
  }
  return html;
}
function expLaporanKetua(){
  const th = FILTER.lkTh || String(new Date().getFullYear());
  const rows = ALL_UNITS.map((un,i)=>{
    const thU = tahunUntukUnit(un, th);
    const m = DB.transaksi.filter(t=>t.unit===un&&t.tahun===thU&&t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);
    const k = DB.transaksi.filter(t=>t.unit===un&&t.tahun===thU&&t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);
    return [i+1, UNITS[un].nama, thU, saldoAwal(un,thU), m, k, saldoAwal(un,thU)+m-k];
  });
  exportExcel('laporan_lengkap_'+th, ['No','Unit','Tahun','Saldo Awal','Masuk','Keluar','Saldo Akhir'], rows);
}
function cetakLaporanKetua(){
  const th = FILTER.lkTh || String(new Date().getFullYear());
  const bl = FILTER.lkBl || '';
  const rows = ALL_UNITS.map((un,i)=>{
    const thU = tahunUntukUnit(un, th);
    const m = DB.transaksi.filter(t=>t.unit===un&&t.tahun===thU&&t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);
    const k = DB.transaksi.filter(t=>t.unit===un&&t.tahun===thU&&t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);
    return [i+1, UNITS[un].nama, thU, rp(saldoAwal(un,thU)), rp(m), rp(k), rp(saldoAwal(un,thU)+m-k)];
  });
  const tglAkhir = tanggalAkhirPeriode('yayasan', { th, bl });
  cetakPDF('LAPORAN LENGKAP SEMUA UNIT', 'Periode: ' + th,
    ['No','Unit','Tahun','Saldo Awal','Masuk','Keluar','Saldo Akhir'], rows, null, 'yayasan', { tanggal: tglAkhir });
}
function expDetailUnit(un){
  const th = FILTER.lkTh || String(new Date().getFullYear());
  const thU = tahunUntukUnit(un, th);
  let data = DB.transaksi.filter(t=>t.unit===un && t.tahun===thU);
  data.sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? -1 : 1);
  exportExcel('detail_'+un+'_'+thU.replace('/','-'), ['No','Tanggal','Jenis','Kategori','Keterangan','Jumlah'],
    data.map((t,i)=>[i+1, fmtTgl(t.tanggal), t.jenis==='masuk'?'Masuk':'Keluar', t.kategori, t.keterangan||'', Number(t.jumlah)]));
}
function cetakDetailUnit(un){
  const th = FILTER.lkTh || String(new Date().getFullYear());
  const bl = FILTER.lkBl || '';
  const thU = tahunUntukUnit(un, th);
  let data = DB.transaksi.filter(t=>t.unit===un && t.tahun===thU);
  data.sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? -1 : 1);
  const tm = data.filter(t=>t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);
  const tk = data.filter(t=>t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);
  const tglAkhir = tanggalAkhirPeriode(un, { th, bl });
  cetakPDF('LAPORAN DETAIL ' + UNITS[un].nama.toUpperCase(), 'Periode: ' + thU,
    ['No','Tanggal','Kategori','Keterangan','Pemasukan','Pengeluaran'],
    data.map((t,i)=>[i+1, fmtTgl(t.tanggal), t.kategori, t.keterangan||'-',
      t.jenis==='masuk'?rp(t.jumlah):'-', t.jenis==='keluar'?rp(t.jumlah):'-']),
    ['','TOTAL','','', rp(tm), rp(tk)], un, { tanggal: tglAkhir });
}
