function viewDataSiswa(u){
  const fk=FILTER.swKelas||'';
  const fst=FILTER.swStatus||'Aktif';
  const tp=UNITS[u].tipe;
  let l=DB.siswa.filter(s=>s.unit===u);
  if(fst && fst!=='semua')l=l.filter(s=>(s.status||'Aktif')===fst);
  if(fk)l=l.filter(s=>s.tingkat===fk);
  l.sort((a,b)=>(a.tingkat+'').localeCompare(b.tingkat+'')||a.nama.localeCompare(b.nama));
  const rows=l.map((s,i)=>{
    const st=s.status||'Aktif';
    const badge=st==='Aktif'?'ok':(st==='Lulus'?'info':'no');
    const canDel=(st==='Lulus'||st==='Keluar');
    // Tombol Keluar hanya untuk non-mahad (SD/TK tidak menampilkan)
    const keluarBtn = (st==='Aktif' && tp!=='mahad') ? `<button class="btn xs purple" onclick="formSiswaKeluarLangsung('${s.id}')">🚪 Keluar</button>` : '';
    return `<tr><td class="c">${i+1}</td><td>${esc(s.nis)}</td><td><strong>${esc(s.nama)}</strong></td><td class="c">${esc(s.tingkat)}</td><td>${esc(s.wali||'-')}</td><td>${esc(s.kontak||'-')}</td><td class="c"><span class="badge ${badge}">${esc(st)}</span></td><td class="c no-print"><button class="btn xs" onclick="editSiswa('${s.id}')">✎ Edit</button>${keluarBtn}${canDel?`<button class="btn xs danger" onclick="hapusSiswa('${s.id}')">🗑</button>`:''}</td></tr>`;
  }).join('');
  const statusOpts=[['Aktif','Aktif'],['Lulus','Lulus'],['Keluar','Keluar'],['semua','Semua']];
  return `<div class="info-box">ℹ️ Siswa aktif tidak dapat dihapus. Untuk mengeluarkan siswa gunakan menu <strong>🔄 Mutasi Siswa</strong>.</div>
  <div class="card" style="border:none;box-shadow:none;padding:0;margin-bottom:14px"><div class="form-actions" style="justify-content:space-between;align-items:center"><button class="btn primary" onclick="formTambahSiswaModal()">➕ Tambah Siswa</button><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" onclick="downloadTemplateSiswa()">📄 Template</button><label class="btn sm accent" style="margin:0">📥 Import<input type="file" accept=".xlsx,.xls,.csv" style="display:none" onchange="importSiswa(event)"></label><button class="btn sm" onclick="expSiswa()">⬇ Excel</button><button class="btn sm" onclick="cetakSiswa()">🖨 Cetak</button></div></div></div>
  <div class="card" style="border:none;box-shadow:none;padding:0"><h3>Daftar Siswa (${l.length})<span class="h3-actions"><select onchange="setFilter('swKelas',this.value)" style="max-width:180px;padding:5px 10px;font-size:12px;margin:0"><option value="">Semua Kelas</option>${TINGKAT[u].map(t=>`<option value="${esc(t)}" ${t===fk?'selected':''}>Kelas ${esc(t)}</option>`).join('')}</select><select onchange="setFilter('swStatus',this.value)" style="max-width:180px;padding:5px 10px;font-size:12px;margin:0">${statusOpts.map(([v,l2])=>`<option value="${v}" ${v===fst?'selected':''}>Status: ${l2}</option>`).join('')}</select></span></h3>${l.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c" style="width:40px">No</th><th>NIS</th><th>Nama</th><th class="c">Tkt</th><th>Wali</th><th>Kontak</th><th class="c">Status</th><th class="c no-print">Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">${fk||fst!=='Aktif'?'Tidak ada siswa pada filter ini.':'Belum ada siswa.'}</div>`}</div>`;
}
function formTambahSiswaModal(){const u=state.ctxUnit;showModal('Tambah Siswa',`<div class="form-grid"><div class="form-row"><label>NIS</label><input id="swNis" required></div><div class="form-row"><label>Nama Lengkap</label><input id="swNama" required></div><div class="form-row"><label>Tingkat</label><select id="swTingkat" required>${TINGKAT[u].map(t=>`<option value="${esc(t)}">Kelas ${esc(t)}</option>`).join('')}</select></div><div class="form-row"><label>Wali</label><input id="swWali"></div><div class="form-row"><label>Kontak</label><input id="swKontak"></div></div><div class="hint" style="margin-bottom:10px">Status awal: Aktif. Untuk siswa pindahan gunakan menu Mutasi Siswa.</div><div class="form-actions"><button class="btn primary" onclick="simpanSiswaBaru()">💾 Simpan</button><button class="btn ghost" onclick="closeModal()">Batal</button></div>`);setTimeout(()=>{const e=document.getElementById('swNis');if(e)e.focus();},20);}
function simpanSiswaBaru(){const u=state.ctxUnit;const n=document.getElementById('swNis').value.trim();const nm=document.getElementById('swNama').value.trim();const t=document.getElementById('swTingkat').value;const w=document.getElementById('swWali').value.trim();const k=document.getElementById('swKontak').value.trim();if(!n){toast('NIS wajib','error');return;}if(!nm){toast('Nama wajib','error');return;}if(DB.siswa.some(x=>x.unit===u&&x.nis===n)){toast('NIS sudah ada','error');return;}DB.siswa.push({id:uid(),unit:u,nis:n,nama:nm,tingkat:t,wali:w,kontak:k,status:'Aktif',tanggalKeluar:'',alasanKeluar:'',jenisKeluar:'',kelasSaatKeluar:'',riwayatMutasi:[]});saveDB();closeModal();toast('Ditambahkan','ok');render();}
function editSiswa(id){const s=DB.siswa.find(x=>x.id===id);if(!s)return;showModal('Edit Siswa',`<div class="form-row"><label>NIS</label><input id="esNis" value="${esc(s.nis)}"></div><div class="form-row"><label>Nama</label><input id="esNama" value="${esc(s.nama)}"></div><div class="form-row"><label>Tingkat</label><select id="esTingkat">${TINGKAT[state.ctxUnit].map(t=>`<option ${t===s.tingkat?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="form-row"><label>Wali</label><input id="esWali" value="${esc(s.wali||'')}"></div><div class="form-row"><label>Kontak</label><input id="esKontak" value="${esc(s.kontak||'')}"></div><div class="form-actions"><button class="btn primary" onclick="simpanEditSiswa('${id}')">Simpan</button><button class="btn ghost" onclick="closeModal()">Batal</button></div>`);}
function simpanEditSiswa(id){const s=DB.siswa.find(x=>x.id===id);if(!s)return;s.nis=document.getElementById('esNis').value.trim();s.nama=document.getElementById('esNama').value.trim();s.tingkat=document.getElementById('esTingkat').value;s.wali=document.getElementById('esWali').value.trim();s.kontak=document.getElementById('esKontak').value.trim();saveDB();closeModal();toast('Diperbarui','ok');render();}
function formSiswaKeluarLangsung(sid){
  const s=DB.siswa.find(x=>x.id===sid);if(!s)return;
  if((s.status||'Aktif')!=='Aktif'){toast('Siswa tidak aktif','error');return;}
  showModal('Siswa Keluar: '+s.nama, `
    <div class="info-box">📤 Siswa akan ditandai keluar dan tidak lagi muncul di kelas.</div>
    <div class="form-row"><label>Tanggal Keluar</label><input type="date" id="pswTanggal" value="${todayStr()}"></div>
    <div class="form-row"><label>Jenis Keluar</label><select id="pswJenis">
      <option value="Pindah">Pindah Sekolah</option>
      <option value="Keluar">Keluar / Berhenti</option>
      <option value="Lulus">Lulus</option>
      <option value="Meninggal">Meninggal</option>
    </select></div>
    <div class="form-row"><label>Alasan / Keterangan</label><input id="pswAlasan"></div>
    <div class="form-actions"><button class="btn primary" onclick="simpanSiswaKeluarLangsung('${sid}')">✓ Proses</button><button class="btn ghost" onclick="closeModal()">Batal</button></div>
  `);
}
function simpanSiswaKeluarLangsung(sid){
  const s=DB.siswa.find(x=>x.id===sid);if(!s)return;
  const tgl=document.getElementById('pswTanggal').value||todayStr();
  const jenis=document.getElementById('pswJenis').value;
  const alasan=document.getElementById('pswAlasan').value.trim();
  const statusBaru=jenis==='Lulus'?'Lulus':'Keluar';
  const kelasLama=s.tingkat;
  s.status=statusBaru;
  s.tanggalKeluar=tgl;
  s.alasanKeluar=alasan;
  s.jenisKeluar=jenis;
  s.kelasSaatKeluar=kelasLama;
  s.riwayatMutasi=s.riwayatMutasi||[];
  s.riwayatMutasi.push({id:uid(),tanggal:tgl,jenis:'keluar',dariKelas:kelasLama,keKelas:'-',jenisKeluar:jenis,alasan:alasan,keterangan:jenis+(alasan?' - '+alasan:'')});
  saveDB();closeModal();toast('Siswa ditandai '+statusBaru,'ok');render();
}
function hapusSiswa(id){
  const s=DB.siswa.find(x=>x.id===id);
  if(!s)return;
  const st=s.status||'Aktif';
  if(st!=='Lulus' && st!=='Keluar'){
    toast('Hanya siswa berstatus Lulus atau Keluar yang dapat dihapus','error');
    return;
  }
  if(!confirm('Hapus siswa ini? Semua pembayaran terkait akan dihapus juga.'))return;
  DB.siswa=DB.siswa.filter(x=>x.id!==id);
  const pi=DB.pembayaran.filter(p=>p.siswaId===id).map(p=>p.id);
  DB.pembayaran=DB.pembayaran.filter(p=>p.siswaId!==id);
  DB.transaksi=DB.transaksi.filter(t=>!pi.includes(t.refId));
  DB.kegiatanPembayaran=DB.kegiatanPembayaran.filter(p=>p.siswaId!==id);
  saveDB();toast('Dihapus','ok');render();
}
function importSiswa(ev){const f=ev.target.files[0];if(!f)return;const u=state.ctxUnit;const r=new FileReader();r.onload=e=>{let rows=[];try{if(typeof XLSX!=='undefined'){const wb=XLSX.read(e.target.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,blankrows:false});}}catch(err){toast('Gagal baca','error');return;}if(!rows.length){toast('Kosong','error');return;}let st=0;const h=(rows[0]||[]).map(x=>String(x).toLowerCase());if(h.some(c=>c.includes('nis')||c.includes('nama')))st=1;let ok=0,sk=0;for(let i=st;i<rows.length;i++){const rr=rows[i]||[];const nis=String(rr[0]??'').trim();const nama=String(rr[1]??'').trim();if(!nis||!nama){sk++;continue;}if(DB.siswa.some(s=>s.unit===u&&s.nis===nis)){sk++;continue;}DB.siswa.push({id:uid(),unit:u,nis,nama,tingkat:String(rr[2]??TINGKAT[u][0]).trim(),wali:String(rr[3]??'').trim(),kontak:String(rr[4]??'').trim(),status:'Aktif',tanggalKeluar:'',alasanKeluar:'',jenisKeluar:'',kelasSaatKeluar:'',riwayatMutasi:[]});ok++;}saveDB();toast(`Import: ${ok} masuk, ${sk} lewat`,'ok');ev.target.value='';render();};r.readAsArrayBuffer(f);}
function downloadTemplateSiswa(){exportExcel('template_siswa',['NIS','Nama','Tingkat','Wali','Kontak','Status'],[['12345','Ahmad Fauzi','1','Bapak Fauzi','08123456789','Aktif']]);}
function expSiswa(){const u=state.ctxUnit,fk=FILTER.swKelas||'',fst=FILTER.swStatus||'Aktif';let l=DB.siswa.filter(s=>s.unit===u);if(fst&&fst!=='semua')l=l.filter(s=>(s.status||'Aktif')===fst);if(fk)l=l.filter(s=>s.tingkat===fk);l.sort((a,b)=>(a.tingkat+'').localeCompare(b.tingkat+'')||a.nama.localeCompare(b.nama));exportExcel('data_siswa_'+u+(fk?'_kelas_'+fk:''),['No','NIS','Nama','Tingkat','Wali','Kontak','Status'],l.map((s,i)=>[i+1,s.nis,s.nama,s.tingkat,s.wali||'',s.kontak||'',s.status||'Aktif']));}
function cetakSiswa(){const u=state.ctxUnit,fk=FILTER.swKelas||'',fst=FILTER.swStatus||'Aktif';let l=DB.siswa.filter(s=>s.unit===u);if(fst&&fst!=='semua')l=l.filter(s=>(s.status||'Aktif')===fst);if(fk)l=l.filter(s=>s.tingkat===fk);l.sort((a,b)=>(a.tingkat+'').localeCompare(b.tingkat+'')||a.nama.localeCompare(b.nama));cetakPDF('Daftar Siswa'+(fk?' — Kelas '+fk:''),'Total '+l.length+' siswa',['No','NIS','Nama','Tingkat','Wali','Kontak','Status'],l.map((s,i)=>[i+1,s.nis,s.nama,s.tingkat,s.wali||'-',s.kontak||'-',s.status||'Aktif']),null,null,{tanggal:todayStr()});}

/* ============ PEMBAYARAN SISWA ============ */
function hitungTagihan(u,s){return getKomponenBiaya(u,s.tingkat).reduce((a,k)=>{const j=Number(k.jumlah)||0;return a+((k.jenis||'tahunan')==='bulanan'?j*12:j);},0);}
function hitungBayar(sid){return DB.pembayaran.filter(p=>p.siswaId===sid).reduce((a,b)=>a+Number(b.jumlah),0);}
function hitungBayarKomponen(sid,k){return DB.pembayaran.filter(p=>p.siswaId===sid&&p.komponen===k).reduce((a,b)=>a+Number(b.jumlah),0);}
function pagePembayaran(){
  const u=state.ctxUnit,th=FILTER.bayTahun||tahunAktif(u),bl=FILTER.bayBulan||'',fk=FILTER.pbKelas||'',fs=FILTER.pbSiswa||'';
  let h=DB.pembayaran.filter(p=>p.unit===u);
  if(th)h=h.filter(p=>tahunDariTanggal(u,p.tanggal)===th);
  if(bl)h=h.filter(p=>(p.tanggal||'').slice(5,7)===bl);
  if(fs)h=h.filter(p=>p.siswaId===fs);
  else if(fk){const ids=new Set(DB.siswa.filter(s=>s.unit===u&&s.tingkat===fk).map(s=>s.id));h=h.filter(p=>ids.has(p.siswaId));}
  h.sort((a,b)=>(a.tanggal||'')<(b.tanggal||'')?1:-1);
  const rows=h.slice(0,300).map((p,i)=>{const s=DB.siswa.find(x=>x.id===p.siswaId);return `<tr><td class="c">${i+1}</td><td>${fmtTgl(p.tanggal)}</td><td>${esc(s?s.nis:'-')}</td><td>${esc(s?s.nama:'(dihapus)')}</td><td class="c">${esc(s?s.tingkat:'-')}</td><td>${esc(p.komponen)}</td><td>${esc(p.keterangan||'-')}</td><td class="r masuk">${rp(p.jumlah)}</td><td class="c no-print"><button class="btn xs" onclick="formEditPembayaran('${p.id}')">Edit</button><button class="btn xs danger" onclick="hapusPembayaran('${p.id}')">Hapus</button></td></tr>`;}).join('');
  const tot=h.reduce((a,b)=>a+Number(b.jumlah),0);
  const tl=Array.from(new Set(DB.pembayaran.filter(p=>p.unit===u).map(p=>tahunDariTanggal(u,p.tanggal)))).sort();if(!tl.includes(th))tl.push(th);
  let ls=DB.siswa.filter(s=>s.unit===u&&(s.status||'Aktif')==='Aktif');if(fk)ls=ls.filter(s=>s.tingkat===fk);
  ls.sort((a,b)=>(a.tingkat+'').localeCompare(b.tingkat+'')||a.nama.localeCompare(b.nama));
  return `<div class="card no-print"><h3>💳 Pembayaran Siswa<span class="h3-actions"><button class="btn sm primary" onclick="formPembayaranModal()">➕ Input Pembayaran</button><button class="btn sm accent" onclick="go('rekapPemb')">📋 Rekap</button><button class="btn sm purple" onclick="go('detailPemb')">🔍 Detail</button></span></h3>
  <div class="filters"><div><label>Kelas</label><select onchange="setFilter('pbKelas',this.value); setFilter('pbSiswa','')"><option value="">Semua Kelas</option>${TINGKAT[u].map(t=>`<option value="${esc(t)}" ${t===fk?'selected':''}>Kelas ${esc(t)}</option>`).join('')}</select></div>
  <div style="min-width:220px"><label>Siswa</label><select onchange="setFilter('pbSiswa',this.value)"><option value="">Semua</option>${ls.map(s=>`<option value="${s.id}" ${s.id===fs?'selected':''}>${esc(s.tingkat)} — ${esc(s.nis)} — ${esc(s.nama)}</option>`).join('')}</select></div>
  <div><label>Tahun</label><select onchange="setFilter('bayTahun',this.value)">${tl.map(t=>`<option value="${t}" ${t===th?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
  <div><label>Bulan</label><select onchange="setFilter('bayBulan',this.value)"><option value="">Semua</option>${BULAN.map((b,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${String(i+1).padStart(2,'0')===bl?'selected':''}>${b}</option>`).join('')}</select></div>
  <button class="btn ghost sm" onclick="resetFilterPembayaran()">↺ Reset</button></div>
  <div class="hint">ℹ️ Biaya <strong>bulanan</strong> otomatis ×12. Hanya siswa aktif yang dapat dibayar.</div></div>
  <div class="card"><h3>📜 Riwayat Pembayaran<span class="h3-actions no-print"><button class="btn sm" onclick="expPembayaran()">⬇ Excel</button><button class="btn sm" onclick="cetakPembayaran()">🖨 Cetak</button></span></h3>
  ${h.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c" style="width:40px">No</th><th>Tgl</th><th>NIS</th><th>Nama</th><th class="c">Tkt</th><th>Komponen</th><th>Ket</th><th class="r">Jumlah</th><th class="c no-print">Aksi</th></tr></thead><tbody>${rows}<tr class="tot-row"><td colspan="7">TOTAL</td><td class="r">${rp(tot)}</td><td class="no-print"></td></tr></tbody></table></div>`:`<div class="empty">Belum ada.</div>`}</div>`;
}
function resetFilterPembayaran(){delete FILTER.pbKelas;delete FILTER.pbSiswa;delete FILTER.bayTahun;delete FILTER.bayBulan;render();}
function pageRekapPemb(){
  const u=state.ctxUnit,fk=FILTER.rpKelas||'',fs=FILTER.rpSiswa||'';
  let l=DB.siswa.filter(s=>s.unit===u&&(s.status||'Aktif')==='Aktif');if(fk)l=l.filter(s=>s.tingkat===fk);if(fs)l=l.filter(s=>s.id===fs);
  l.sort((a,b)=>(a.tingkat+'').localeCompare(b.tingkat+'')||a.nama.localeCompare(b.nama));
  const rows=l.map((s,i)=>{const t=hitungTagihan(u,s);const b=hitungBayar(s.id);const si=t-b;const ps=t>0?Math.min(100,Math.round(b/t*100)):0;const st=(t>0&&si<=0)?'<span class="badge ok">Lunas</span>':(b>0?'<span class="badge pending">Kurang</span>':(t>0?'<span class="badge no">Belum</span>':'<span class="badge info">—</span>'));return `<tr><td class="c">${i+1}</td><td>${esc(s.nis)}</td><td><strong>${esc(s.nama)}</strong></td><td class="c">${esc(s.tingkat)}</td><td class="r">${rp(t)}</td><td class="r masuk">${rp(b)}</td><td class="r ${si>0?'keluar':'masuk'}">${rp(si)}</td><td style="min-width:110px"><div class="bar"><i style="width:${ps}%"></i></div><small style="color:#94a3b8">${ps}%</small></td><td class="c">${st}</td><td class="c no-print"><button class="btn xs primary" onclick="showDetailPembayaranSiswa('${s.id}')">Detail</button></td></tr>`;}).join('');
  const tt=l.reduce((a,s)=>a+hitungTagihan(u,s),0);const tb=l.reduce((a,s)=>a+hitungBayar(s.id),0);
  return `<div class="card no-print"><h3>📋 Rekap Pembayaran<span class="h3-actions"><button class="btn sm ghost" onclick="go('pembayaran')">← Pembayaran</button><button class="btn sm" onclick="expRekap()">⬇ Excel</button><button class="btn sm" onclick="cetakRekap()">🖨 Cetak</button></span></h3>
  <div class="filters"><div><label>Kelas</label><select onchange="setFilter('rpKelas',this.value); setFilter('rpSiswa','')"><option value="">Semua Kelas</option>${TINGKAT[u].map(t=>`<option value="${esc(t)}" ${t===fk?'selected':''}>Kelas ${esc(t)}</option>`).join('')}</select></div>
  <div style="min-width:220px"><label>Siswa</label><select onchange="setFilter('rpSiswa',this.value)"><option value="">Semua</option>${DB.siswa.filter(s=>s.unit===u&&(s.status||'Aktif')==='Aktif'&&(!fk||s.tingkat===fk)).sort((a,b)=>(a.tingkat+'').localeCompare(b.tingkat+'')||a.nama.localeCompare(b.nama)).map(s=>`<option value="${s.id}" ${s.id===fs?'selected':''}>${esc(s.tingkat)} — ${esc(s.nis)} — ${esc(s.nama)}</option>`).join('')}</select></div>
  <button class="btn ghost sm" onclick="setFilter('rpKelas',''); setFilter('rpSiswa','')">↺ Reset</button></div></div>
  <div class="cards compact"><div class="stat compact"><span>Total Tagihan</span><strong>${rp(tt)}</strong></div><div class="stat compact green"><span>Total Dibayar</span><strong>${rp(tb)}</strong></div><div class="stat compact red"><span>Kekurangan</span><strong>${rp(tt-tb)}</strong></div><div class="stat compact amber"><span>Progres</span><strong>${tt>0?Math.round(tb/tt*100):0}%</strong></div></div>
  <div class="card"><h3>Tabel Rekap</h3>${l.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c" style="width:40px">No</th><th>NIS</th><th>Nama</th><th class="c">Tkt</th><th class="r">Tagihan</th><th class="r">Dibayar</th><th class="r">Kurang</th><th>Progress</th><th class="c">Status</th><th class="c no-print">Aksi</th></tr></thead><tbody>${rows}<tr class="tot-row"><td colspan="4">TOTAL</td><td class="r">${rp(tt)}</td><td class="r">${rp(tb)}</td><td class="r">${rp(tt-tb)}</td><td colspan="3"></td></tr></tbody></table></div>`:`<div class="empty">Tidak ada siswa aktif.</div>`}</div>`;
}
function pageDetailPemb(){
  const u=state.ctxUnit,fk=FILTER.dpKelas||'',fs=FILTER.dpSiswa||'';
  let ls=DB.siswa.filter(s=>s.unit===u&&(s.status||'Aktif')==='Aktif');if(fk)ls=ls.filter(s=>s.tingkat===fk);
  ls.sort((a,b)=>(a.tingkat+'').localeCompare(b.tingkat+'')||a.nama.localeCompare(b.nama));
  let dh='';
  if(fs){
    const s=DB.siswa.find(x=>x.id===fs);
    if(s){
      const kl=komponenListUntukSiswa(u,s);let rows='';let tt=0,tb=0;
      kl.forEach((k,i)=>{const t=Number(k.tagihan)||0;const b=hitungBayarKomponen(s.id,k.nama);const si=t-b;tt+=t;tb+=b;const st=(t>0&&si<=0)?'<span class="badge ok">Lunas</span>':(b>0?'<span class="badge pending">Kurang</span>':(t>0?'<span class="badge no">Belum</span>':'<span class="badge info">—</span>'));const jb=(k.jenis||'tahunan')==='bulanan'?'<span class="badge info" style="font-size:9.5px">Bulanan × 12</span>':'<span class="badge purple" style="font-size:9.5px">Tahunan</span>';rows+=`<tr><td class="c">${i+1}</td><td>${esc(k.nama)} <small>${jb}</small></td><td class="r">${rp(t)}</td><td class="r masuk">${rp(b)}</td><td class="r ${si>0?'keluar':'masuk'}">${rp(si)}</td><td class="c">${st}</td></tr>`;});
      const tot=(tt>0&&tb>=tt)?'<span class="badge ok">Lunas</span>':'<span class="badge pending">Belum Lunas</span>';
      rows+=`<tr class="tot-row"><td class="c"></td><td>TOTAL</td><td class="r">${rp(tt)}</td><td class="r">${rp(tb)}</td><td class="r">${rp(tt-tb)}</td><td class="c">${tot}</td></tr>`;
      const bl=DB.pembayaran.filter(p=>p.siswaId===s.id).sort((a,b2)=>(a.tanggal||'')<(b2.tanggal||'')?1:-1).map((p,i)=>`<tr><td class="c">${i+1}</td><td>${fmtTgl(p.tanggal)}</td><td>${esc(p.komponen)}</td><td>${esc(p.keterangan||'-')}</td><td class="r">${rp(p.jumlah)}</td></tr>`).join('');
      dh=`<div class="card"><h3>👨‍🎓 ${esc(s.nama)}<span class="h3-actions no-print"><button class="btn sm primary" onclick="formPembayaranModal('${s.id}')">➕ Input</button><button class="btn sm" onclick="cetakDetailSiswa('${s.id}')">🖨 Cetak</button></span></h3>
      <div class="hint" style="margin-bottom:12px">NIS: <strong>${esc(s.nis)}</strong> &middot; Kelas: <strong>${esc(s.tingkat)}</strong></div>
      <div class="cards compact" style="margin-bottom:14px"><div class="stat compact"><span>Total Tagihan</span><strong>${rp(tt)}</strong></div><div class="stat compact green"><span>Dibayar</span><strong>${rp(tb)}</strong></div><div class="stat compact red"><span>Kurang</span><strong>${rp(tt-tb)}</strong></div><div class="stat compact amber"><span>Progres</span><strong>${tt>0?Math.round(tb/tt*100):0}%</strong></div></div>
      <div class="section-title">Rincian Komponen</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c" style="width:40px">No</th><th>Komponen</th><th class="r">Tagihan</th><th class="r">Dibayar</th><th class="r">Sisa</th><th class="c">Status</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="section-title">Riwayat Pembayaran</div>${bl?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c" style="width:40px">No</th><th>Tgl</th><th>Komponen</th><th>Ket</th><th class="r">Jumlah</th></tr></thead><tbody>${bl}</tbody></table></div>`:'<div class="empty">Belum ada.</div>'}</div>`;
    }
  } else dh=`<div class="card"><div class="empty">Pilih siswa untuk melihat detail.</div></div>`;
  return `<div class="card no-print"><h3>🔍 Detail Pembayaran<span class="h3-actions"><button class="btn sm" onclick="go('pembayaran')">← Pembayaran</button><button class="btn sm" onclick="go('rekapPemb')">📋 Rekap</button></span></h3>
  <div class="filters"><div><label>Kelas</label><select onchange="setFilter('dpKelas',this.value); setFilter('dpSiswa','')"><option value="">Semua Kelas</option>${TINGKAT[u].map(t=>`<option value="${esc(t)}" ${t===fk?'selected':''}>Kelas ${esc(t)}</option>`).join('')}</select></div>

function pageKegiatan(){
  const u=state.ctxUnit,fs=FILTER.kgStatus||'aktif';
  let l=DB.kegiatan.filter(k=>k.unit===u);
  if(fs==='aktif')l=l.filter(k=>!k.selesai);
  if(fs==='selesai')l=l.filter(k=>k.selesai);
  l.sort((a,b)=>(a.tanggal||'')<(b.tanggal||'')?1:-1);
  const rows=l.map((k,i)=>{
    const bs=kegiatanPemasukanSiswa(k.id),ml=kegiatanTransMasuk(k.id),kl=kegiatanTransKeluar(k.id);
    const s=bs+ml-kl;const t=Number(k.target)||0;const ps=t>0?Math.min(100,Math.round(bs/t*100)):0;
    const kls=kegiatanKelasList(k);const klbl=kls.map(x=>'Kelas '+x).join(', ')||'-';
    const isS=!!k.selesai;const canS=!isS&&s===0&&!!(bs+ml);
    return `<tr><td class="c">${i+1}</td><td class="c no-print"><button class="btn xs primary" onclick="bukaKegiatan('${k.id}')">Kelola</button></td><td><strong>${esc(k.nama)}</strong> ${isS?'<span class="badge selesai">Selesai</span>':''}<br><small style="color:#94a3b8">${esc(k.keterangan||'')}</small></td><td>${fmtTgl(k.tanggal)}</td><td><small>${esc(klbl)}</small></td><td class="r">${rp(k.biayaPerSiswa||0)}</td><td class="r masuk">${rp(bs)}</td><td class="r">${t>0?ps+'%':'—'}</td><td class="r ${s>=0?'masuk':'keluar'}"><strong>${rp(s)}</strong></td><td class="c no-print">${!isS?`<button class="btn xs success" onclick="selesaikanKegiatan('${k.id}')" ${canS?'':'disabled'} title="${canS?'Selesaikan':'Saldo harus 0'}">✓</button><button class="btn xs danger" onclick="hapusKegiatan('${k.id}')">Hapus</button>`:`<button class="btn xs danger" onclick="hapusKegiatan('${k.id}')">Hapus</button>`}</td></tr>`;
  }).join('');
  return `<div class="card no-print"><h3>📚 Kegiatan Siswa<span class="h3-actions"><button class="btn sm primary" onclick="formTambahKegiatan()">➕ Buat Kegiatan</button></span></h3>
  <div class="filters"><div><label>Status</label><select onchange="setFilter('kgStatus',this.value)"><option value="aktif" ${fs==='aktif'?'selected':''}>Aktif</option><option value="selesai" ${fs==='selesai'?'selected':''}>Selesai</option><option value="semua" ${fs==='semua'?'selected':''}>Semua</option></select></div></div>
  <div class="info-box">ℹ️ Pembayaran siswa <strong>tidak masuk transaksi sekolah</strong>, kecuali transfer dana ke/dari kas. Tombol <strong>✓</strong> aktif saat saldo = Rp 0.</div></div>
  <div class="card"><h3>Daftar Kegiatan (${l.length})</h3>${l.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c" style="width:40px">No</th><th class="c no-print">Kelola</th><th>Nama Kegiatan</th><th>Tanggal</th><th>Kelas</th><th class="r">Biaya/Siswa</th><th class="r">Bayar Siswa</th><th class="r">Progres</th><th class="r">Saldo</th><th class="c no-print">Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">Belum ada kegiatan.</div>`}</div>`;
}

function simpanKegiatan(editId){

function selesaikanKegiatan(id){const kg=DB.kegiatan.find(k=>k.id===id);if(!kg){toast('Tidak ditemukan','error');return;}if(kg.selesai){toast('Sudah selesai','error');return;}const s=saldoKegiatan(id);if(s!==0){toast('Saldo harus Rp 0 (sekarang '+rp(s)+')','error');return;}if(!confirm(`Selesaikan kegiatan "${kg.nama}"?`))return;kg.selesai=true;kg.selesaiAt=todayStr();saveDB();toast('✓ Kegiatan diselesaikan','ok');render();}
function pageKegiatanDetail(){
  const kg=DB.kegiatan.find(k=>k.id===state.kegiatanId);
  if(!kg)return '<div class="card">Kegiatan tidak ditemukan.</div>';
  const v=state.kegiatanView||'ringkasan';const isS=!!kg.selesai;
  const tabs=[{id:'ringkasan',label:'📋 Ringkasan'},{id:'transaksi',label:'💵 Pemasukan/Pengeluaran'},{id:'pembayaran',label:'👨‍🎓 Pembayaran Siswa'},{id:'rekap',label:'📊 Rekap & Tunggakan'},{id:'dana',label:'🔄 Dana Sekolah'}];
  const tabsHtml=`<div class="tabs no-print">${tabs.map(t=>`<button class="tab-btn ${t.id===v?'active':''}" onclick="setKegiatanView('${t.id}')">${t.label}</button>`).join('')}</div>`;
  const kl=kegiatanKelasList(kg);const klbl=kl.map(t=>'Kelas '+t).join(', ')||'-';
  const s=saldoKegiatan(kg.id);
  const headerHtml=`<div class="card"><h3>📚 ${esc(kg.nama)} ${isS?'<span class="badge selesai">Selesai '+fmtTgl(kg.selesaiAt)+'</span>':''}<span class="h3-actions no-print"><button class="btn sm ghost" onclick="go('kegiatan')">← Kembali</button>${!isS?`<button class="btn sm primary" onclick="formTambahKegiatan('${kg.id}')">✎ Edit Info</button><button class="btn sm success" onclick="selesaikanKegiatan('${kg.id}')" ${s===0?'':'disabled'} title="${s===0?'Selesaikan':'Saldo harus 0'}">✓ Selesaikan</button>`:''}</span></h3>
  <div style="font-size:12.5px;color:#64748b;margin-bottom:10px">${fmtTgl(kg.tanggal)} &middot; Kelas: <strong>${esc(klbl)}</strong> &middot; Biaya/Siswa: <strong>${rp(kg.biayaPerSiswa||0)}</strong>${kg.target?` &middot; Target: <strong>${rp(kg.target)}</strong>`:''}${kg.keterangan?`<br>${esc(kg.keterangan)}`:''}</div>
  <div class="cards compact" style="margin-bottom:0"><div class="stat compact green"><span>Bayar Siswa</span><strong>${rp(kegiatanPemasukanSiswa(kg.id))}</strong></div><div class="stat compact"><span>Pemasukan Lain</span><strong>${rp(kegiatanTransMasuk(kg.id))}</strong></div><div class="stat compact red"><span>Pengeluaran</span><strong>${rp(kegiatanTransKeluar(kg.id))}</strong></div><div class="stat compact amber"><span>Saldo</span><strong>${rp(s)}</strong></div></div></div>`;
  let c='';
  if(v==='ringkasan')c=viewKegiatanRingkasan(kg);
  else if(v==='transaksi')c=viewKegiatanTransaksi(kg);
  else if(v==='pembayaran')c=viewKegiatanPembayaran(kg);
  else if(v==='rekap')c=viewKegiatanRekap(kg);
  else if(v==='dana')c=viewKegiatanDana(kg);
  return headerHtml+tabsHtml+c;
}
function viewKegiatanRingkasan(kg){
  const items=[];
  DB.kegiatanPembayaran.filter(p=>p.kegiatanId===kg.id).forEach(p=>{
    const s=DB.siswa.find(x=>x.id===p.siswaId);
    items.push({tgl:p.tanggal,kategori:'Pembayaran Siswa',keterangan:`${s?s.nama:''} ${s?'('+s.tingkat+')':''}${p.keterangan?' - '+p.keterangan:''}`,masuk:Number(p.jumlah)||0,keluar:0});
  });
  DB.kegiatanTrans.filter(t=>t.kegiatanId===kg.id).forEach(t=>{
    items.push({tgl:t.tanggal,kategori:t.jenis==='masuk'?'Pemasukan Lain':'Pengeluaran',keterangan:t.keterangan||'',masuk:t.jenis==='masuk'?Number(t.jumlah):0,keluar:t.jenis==='keluar'?Number(t.jumlah):0});
  });
  items.sort((a,b)=>(a.tgl||'')<(b.tgl||'')?-1:1);
  const rows=items.map((it,i)=>`<tr>
    <td class="c">${i+1}</td>
    <td>${it.tgl?fmtTgl(it.tgl):''}</td>
    <td>${esc(it.kategori||'')}</td>
    <td>${esc(it.keterangan||'')}</td>
    <td class="r masuk">${it.masuk?rp(it.masuk):'-'}</td>
    <td class="r keluar">${it.keluar?rp(it.keluar):'-'}</td>
  </tr>`).join('');
  const tM=items.reduce((a,b)=>a+(Number(b.masuk)||0),0);
  const tK=items.reduce((a,b)=>a+(Number(b.keluar)||0),0);
  return `<div class="card"><h3>📜 Riwayat Transaksi<span class="h3-actions no-print"><button class="btn sm" onclick="cetakLaporanArusKasKegiatan('${kg.id}')">🖨 Cetak Laporan</button></span></h3>
  ${items.length?`<div class="tbl-wrap"><table class="tbl">
    <thead><tr><th class="c" style="width:40px">No</th><th>Tgl</th><th>Kategori</th><th>Keterangan</th><th class="r">Masuk</th><th class="r">Keluar</th></tr></thead>
    <tbody>${rows}<tr class="tot-row"><td colspan="4">TOTAL</td><td class="r masuk">${rp(tM)}</td><td class="r keluar">${rp(tK)}</td></tr></tbody>
  </table></div>`:`<div class="empty">Belum ada transaksi.</div>`}</div>`;
}
function cetakLaporanArusKasKegiatan(kgId){
  const kg=DB.kegiatan.find(k=>k.id===kgId);if(!kg)return;
  const items=[];
  DB.kegiatanPembayaran.filter(p=>p.kegiatanId===kgId).forEach(p=>{
    const s=DB.siswa.find(x=>x.id===p.siswaId);
    items.push({tgl:p.tanggal,kategori:'Pembayaran Siswa',keterangan:`${s?s.nama:''} ${s?'('+s.tingkat+')':''}${p.keterangan?' - '+p.keterangan:''}`,masuk:Number(p.jumlah)||0,keluar:0});
  });
  DB.kegiatanTrans.filter(t=>t.kegiatanId===kgId).forEach(t=>{
    items.push({tgl:t.tanggal,kategori:t.jenis==='masuk'?'Pemasukan Lain':'Pengeluaran',keterangan:t.keterangan||'',masuk:t.jenis==='masuk'?Number(t.jumlah):0,keluar:t.jenis==='keluar'?Number(t.jumlah):0});
  });
  items.sort((a,b)=>(a.tgl||'')<(b.tgl||'')?-1:1);
  cetakLaporanArusKasPDF('Laporan Arus Kas Kegiatan', 'Kegiatan: '+kg.nama+' — '+fmtTgl(kg.tanggal), items, kg.unit, {tanggal:todayStr()});
}
function viewKegiatanTransaksi(kg){
  const isS=!!kg.selesai;
  const m=DB.kegiatanTrans.filter(t=>t.kegiatanId===kg.id&&t.jenis==='masuk').sort((a,b)=>(a.tanggal||'')<(b.tanggal||'')?-1:1);
  const k=DB.kegiatanTrans.filter(t=>t.kegiatanId===kg.id&&t.jenis==='keluar').sort((a,b)=>(a.tanggal||'')<(b.tanggal||'')?-1:1);
  const render=(list)=>list.map((t,i)=>{
    const lk=!!t.refId;
    return `<tr><td class="c">${i+1}</td><td>${fmtTgl(t.tanggal)}</td><td>${esc(t.keterangan||'-')}</td><td class="r ${t.jenis==='masuk'?'masuk':'keluar'}">${rp(t.jumlah)}</td><td class="c no-print">${!isS?`<button class="btn xs" onclick="formEditKegiatanTrans('${t.id}')">Edit</button>${lk?`<span class="lock-badge">🔒</span>`:`<button class="btn xs danger" onclick="hapusKegiatanTrans('${t.id}')">Hapus</button>`}`:`<span class="lock-badge">🔒</span>`}</td></tr>`;
  }).join('');
  return `${!isS?`<div class="card no-print"><h3>💵 Pemasukan / Pengeluaran Kegiatan<span class="h3-actions"><button class="btn sm primary" onclick="formKegiatanTransModal()">➕ Input</button></span></h3><div class="hint">💡 Tidak masuk transaksi sekolah kecuali transfer dana.</div></div>`:''}
  <div class="card"><h3>📥 Daftar Pemasukan (${m.length})</h3>${m.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c" style="width:40px">No</th><th>Tgl</th><th>Keterangan</th><th class="r">Jumlah</th><th class="c no-print">Aksi</th></tr></thead><tbody>${render(m)}</tbody></table></div>`:`<div class="empty">Belum ada.</div>`}</div>
  <div class="card"><h3>📤 Daftar Pengeluaran (${k.length})</h3>${k.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c" style="width:40px">No</th><th>Tgl</th><th>Keterangan</th><th class="r">Jumlah</th><th class="c no-print">Aksi</th></tr></thead><tbody>${render(k)}</tbody></table></div>`:`<div class="empty">Belum ada.</div>`}</div>`;

function formKegiatanTransModal(){const kg=DB.kegiatan.find(k=>k.id===state.kegiatanId);if(!kg)return;if(kg.selesai){toast('Kegiatan selesai','error');return;}showModal('Input Pemasukan / Pengeluaran — '+kg.nama,`<div class="form-grid"><div class="form-row"><label>Tanggal</label><input type="date" id="kgtTanggal" value="${todayStr()}" required></div><div class="form-row"><label>Jenis</label><select id="kgtJenis"><option value="masuk">Pemasukan</option><option value="keluar">Pengeluaran</option></select></div></div><div class="form-row"><label>Jumlah (Rp)</label><input type="number" id="kgtJumlah" min="0" required></div><div class="form-row"><label>Keterangan</label><input id="kgtKet"></div><div class="form-actions"><button class="btn primary" onclick="simpanKegiatanTrans()">💾 Simpan</button><button class="btn ghost" onclick="closeModal()">Batal</button></div>`);setTimeout(()=>{const e=document.getElementById('kgtJumlah');if(e)e.focus();},20);}
function simpanKegiatanTrans(){const kg=DB.kegiatan.find(k=>k.id===state.kegiatanId);if(!kg)return;if(kg.selesai){toast('Selesai','error');return;}const j=document.getElementById('kgtJenis').value;const jml=Number(document.getElementById('kgtJumlah').value)||0;if(jml<=0){toast('Jumlah tidak valid','error');return;}DB.kegiatanTrans.push({id:uid(),kegiatanId:kg.id,unit:kg.unit,tanggal:document.getElementById('kgtTanggal').value||todayStr(),jenis:j,jumlah:jml,keterangan:document.getElementById('kgtKet').value.trim(),refId:''});saveDB();closeModal();toast('Disimpan','ok');render();}
function hapusKegiatanTrans(id){const t=DB.kegiatanTrans.find(x=>x.id===id);if(!t)return;const kg=DB.kegiatan.find(k=>k.id===t.kegiatanId);if(kg&&kg.selesai){toast('Kegiatan selesai','error');return;}if(t.refId){toast('Transaksi terkunci. Hapus dari tab Dana Sekolah.','error');return;}if(!confirm('Hapus?'))return;DB.kegiatanTrans=DB.kegiatanTrans.filter(x=>x.id!==id);saveDB();toast('Dihapus','ok');render();}
function formEditKegiatanTrans(id){
  const t=DB.kegiatanTrans.find(x=>x.id===id);if(!t)return;
  const kg=DB.kegiatan.find(k=>k.id===t.kegiatanId);
  if(kg&&kg.selesai){toast('Kegiatan selesai','error');return;}
  const isT=!!t.refId;
  const jenisLbl=t.jenis==='masuk'?'Masuk ke Kegiatan':'Keluar dari Kegiatan';
  showModal('Edit Transaksi Kegiatan',`${isT?`<div class="info-box">⚡ Ini <strong>transfer dana</strong>. Mengubah jumlah/tanggal akan otomatis mengubah transaksi di menu Transaksi sekolah.</div>`:''}
  <div class="form-grid">
    <div class="form-row"><label>Tanggal</label><input type="date" id="ektTanggal" value="${esc(t.tanggal)}" required></div>
    ${!isT?`<div class="form-row"><label>Jenis</label><select id="ektJenis"><option value="masuk" ${t.jenis==='masuk'?'selected':''}>Pemasukan</option><option value="keluar" ${t.jenis==='keluar'?'selected':''}>Pengeluaran</option></select></div>`:`<div class="form-row"><label>Jenis</label><input value="${jenisLbl}" disabled></div>`}
  </div>
  <div class="form-row"><label>Jumlah (Rp)</label><input type="number" id="ektJumlah" min="0" value="${Number(t.jumlah)}" required></div>
  <div class="form-row"><label>Keterangan</label><input id="ektKet" value="${esc(t.keterangan||'')}"></div>
  <div class="form-actions"><button class="btn primary" onclick="simpanEditKegiatanTrans('${id}')">💾 Simpan</button><button class="btn ghost" onclick="closeModal()">Batal</button></div>`);
}
function simpanEditKegiatanTrans(id){
  const t=DB.kegiatanTrans.find(x=>x.id===id);if(!t)return;
  const kg=DB.kegiatan.find(k=>k.id===t.kegiatanId);
  if(kg&&kg.selesai){toast('Selesai','error');return;}
  const tgl=document.getElementById('ektTanggal').value;
  const jml=Number(document.getElementById('ektJumlah').value)||0;
  const ket=document.getElementById('ektKet').value.trim();
  if(!tgl){toast('Tanggal wajib','error');return;}
  if(jml<=0){toast('Jumlah tidak valid','error');return;}
  const isT=!!t.refId;
  if(!isT){t.jenis=document.getElementById('ektJenis').value;}
  t.tanggal=tgl;t.jumlah=jml;t.keterangan=ket;
  if(isT&&kg){
    const tr=DB.transaksi.find(x=>x.refId===t.refId);
    if(tr){
      tr.tanggal=tgl;
      const newTh=tahunDariTanggal(kg.unit,tgl);
      tr.tahun=newTh;tr.jumlah=jml;
      if(ket)tr.keterangan=ket;
      if(!(DB.years[kg.unit]||[]).some(y=>y.tahun===newTh)){DB.years[kg.unit]=DB.years[kg.unit]||[];DB.years[kg.unit].push({id:uid(),tahun:newTh,saldoAwal:0,aktif:false});}
    }
  }
  saveDB();closeModal();toast('Diperbarui','ok');render();
}

  <div class="card"><h3>📜 Riwayat Pembayaran</h3>${ap.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c" style="width:40px">No</th><th>Tgl</th><th>NIS</th><th>Nama</th><th class="c">Tkt</th><th>Ket</th><th class="r">Jumlah</th><th class="c no-print">Aksi</th></tr></thead><tbody>${rows}<tr class="tot-row"><td colspan="6">TOTAL</td><td class="r">${rp(tot)}</td><td class="no-print"></td></tr></tbody></table></div>`:`<div class="empty">Belum ada.</div>`}</div>`;
}

function viewKegiatanRekap(kg){
  const u=state.ctxUnit;const kl=kegiatanKelasList(kg);const fk=FILTER.kgRekapKelas||'';
  let l=DB.siswa.filter(s=>s.unit===u&&(s.status||'Aktif')==='Aktif'&&kl.includes(s.tingkat));
  if(fk&&kl.includes(fk))l=l.filter(s=>s.tingkat===fk);

function simpanEditEventTrans(id){
  const t=DB.eventTrans.find(x=>x.id===id);if(!t)return;
  const ev=DB.events.find(e=>e.id===t.eventId);
  if(ev&&ev.selesai){toast('Selesai','error');return;}
  const tgl=document.getElementById('eetTanggal').value;
  const jml=Number(document.getElementById('eetJumlah').value)||0;
  const ket=document.getElementById('eetKet').value.trim();
  if(!tgl){toast('Tanggal wajib','error');return;}
  if(jml<=0){toast('Jumlah tidak valid','error');return;}
  const isT=!!t.refId;
  if(!isT){t.jenis=document.getElementById('eetJenis').value;}
  t.tanggal=tgl;t.jumlah=jml;t.keterangan=ket;
  if(isT&&ev){
    const tr=DB.transaksi.find(x=>x.refId===t.refId);
    if(tr){
      tr.tanggal=tgl;
      const newTh=tahunDariTanggal(ev.unit,tgl);
      tr.tahun=newTh;tr.jumlah=jml;
      if(ket)tr.keterangan=ket;
      if(!(DB.years[ev.unit]||[]).some(y=>y.tahun===newTh)){DB.years[ev.unit]=DB.years[ev.unit]||[];DB.years[ev.unit].push({id:uid(),tahun:newTh,saldoAwal:0,aktif:false});}
    }
  }
  saveDB();closeModal();toast('Diperbarui','ok');render();
}

function simpanBendaharaProgram(evId){
  const ev=DB.events.find(e=>e.id===evId);if(!ev)return;
  const un=document.getElementById('bpUsername').value.trim().toLowerCase();
  const n=document.getElementById('bpNama').value.trim();
  const p=document.getElementById('bpPass').value;
  const p2=document.getElementById('bpPass2').value;
  if(!un||!/^[a-z0-9_.]+$/.test(un)){toast('Username tidak valid','error');return;}
  if(DB.users[un]){toast('Username sudah dipakai','error');return;}
  if(!n){toast('Nama wajib','error');return;}
  if(p.length<3){toast('Password min 3','error');return;}
  if(p!==p2){toast('Konfirmasi tidak sama','error');return;}
  DB.users[un]={pass:p,nama:n,role:'bendahara_program',unit:ev.unit,programId:ev.id};
  if(!ev.bendahara)ev.bendahara=n;
  if(!ev.bendaharaUsername)ev.bendaharaUsername=un;
  saveDB();saveUsers();closeModal();toast('✓ Bendahara program ditambahkan','ok');render();
}
function hapusUserBendahara(un){
  const i=DB.users[un];if(!i)return;

}

function setujuiPermohonan(id){
  const p=DB.permohonan.find(x=>x.id===id);if(!p||p.status!=='pending')return;
  if(!confirm(`Setujui ${rp(p.jumlah)}?`))return;
  const thY=tahunAktif('yayasan'),thU=tahunAktif(p.dari),tgl=todayStr(),nm=shortUnitName(p.dari),rid='pm-'+p.id;
  if(p.jenis==='minta'){

/* ============ LAPORAN KETUA ============ */
function pageLaporanKetua(){
  const th=FILTER.lkTh||String(new Date().getFullYear()),bl=FILTER.lkBl||'',du=FILTER.lkUnit||'';
  const tl=Array.from(new Set([...ALL_UNITS.flatMap(un=>(DB.years[un]||[]).map(y=>y.tahun)),...DB.transaksi.map(t=>t.tahun),String(new Date().getFullYear())])).sort();
  function hu(un){const thU=tahunUntukUnit(un,th);let d=DB.transaksi.filter(t=>t.unit===un&&t.tahun===thU);if(bl)d=d.filter(t=>(t.tanggal||'').slice(5,7)===bl);const m=d.filter(t=>t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);const k=d.filter(t=>t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);let sa=saldoAwal(un,thU);if(bl){DB.transaksi.filter(t=>t.unit===un&&t.tahun===thU&&(t.tanggal||'').slice(5,7)<bl).forEach(t=>sa+=t.jenis==='masuk'?Number(t.jumlah):-Number(t.jumlah));}return {masuk:m,keluar:k,sa,akhir:sa+m-k,data:d,thU};}
  const hs=ALL_UNITS.map(un=>({un,...hu(un)}));
  const tM=hs.reduce((a,h)=>a+h.masuk,0),tK=hs.reduce((a,h)=>a+h.keluar,0),tA=hs.reduce((a,h)=>a+h.akhir,0);
  const pl=bl?`${BULAN[Number(bl)-1]} ${th}`:`Tahun ${th}`;
  let h=`<div class="card no-print"><h3>📚 Laporan Lengkap Semua Unit</h3><div class="filters"><div><label>Tahun</label><select onchange="setFilter('lkTh',this.value)">${tl.map(t=>`<option value="${t}" ${t===th?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div><label>Periode</label><select onchange="setFilter('lkBl',this.value)"><option value="">Tahunan</option>${BULAN.map((b,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${String(i+1).padStart(2,'0')===bl?'selected':''}>${b}</option>`).join('')}</select></div><div><label>Detail Unit</label><select onchange="setFilter('lkUnit',this.value)"><option value="">— Ringkasan —</option>${ALL_UNITS.map(un=>`<option value="${un}" ${un===du?'selected':''}>${esc(UNITS[un].nama)}</option>`).join('')}</select></div></div><div class="form-actions" style="margin-top:14px"><button class="btn sm" onclick="expLaporanKetua()">⬇ Excel</button><button class="btn sm" onclick="cetakLaporanKetua()">🖨 Cetak</button></div><div class="hint">💡 Tahun otomatis dikonversi untuk SD/TK.</div></div>
  <div class="cards compact"><div class="stat compact purple"><span>Total Pemasukan</span><strong>${rp(tM)}</strong></div><div class="stat compact red"><span>Total Pengeluaran</span><strong>${rp(tK)}</strong></div><div class="stat compact green"><span>Saldo Akhir</span><strong>${rp(tA)}</strong></div><div class="stat compact amber"><span>Jumlah Transaksi</span><strong>${num(hs.reduce((a,h)=>a+h.data.length,0))}</strong></div></div>`;
  const rows=hs.map((h,i)=>`<tr><td class="c">${i+1}</td><td><strong>${esc(UNITS[h.un].nama)}</strong></td><td class="c">${esc(h.thU)}</td><td class="r">${rp(h.sa)}</td><td class="r masuk">${rp(h.masuk)}</td><td class="r keluar">${rp(h.keluar)}</td><td class="r"><strong>${rp(h.akhir)}</strong></td><td class="c no-print"><button class="btn xs primary" onclick="setFilter('lkUnit','${h.un}')">Detail</button></td></tr>`).join('');
  h+=`<div class="card"><h3>Ringkasan — ${esc(pl)}</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c" style="width:40px">No</th><th>Unit</th><th class="c">Tahun</th><th class="r">Saldo Awal</th><th class="r">Masuk</th><th class="r">Keluar</th><th class="r">Saldo Akhir</th><th class="c no-print">Aksi</th></tr></thead><tbody>${rows}<tr class="tot-row"><td class="c"></td><td colspan="2">TOTAL</td><td class="r">-</td><td class="r">${rp(tM)}</td><td class="r">${rp(tK)}</td><td class="r">${rp(tA)}</td><td class="no-print"></td></tr></tbody></table></div></div>`;
  if(du&&UNITS[du]){
    const h=hs.find(x=>x.un===du);const d=h.data.sort((a,b)=>(a.tanggal||'')<(b.tanggal||'')?-1:1);let run=h.sa;
    const dr=d.map((t,i)=>{run+=t.jenis==='masuk'?Number(t.jumlah):-Number(t.jumlah);return `<tr><td class="c">${i+1}</td><td>${fmtTgl(t.tanggal)}</td><td>${esc(t.kategori)}</td><td>${esc(t.keterangan||'-')}</td><td class="r masuk">${t.jenis==='masuk'?rp(t.jumlah):'-'}</td><td class="r keluar">${t.jenis==='keluar'?rp(t.jumlah):'-'}</td><td class="r"><strong>${rp(run)}</strong></td></tr>`;}).join('');
    h+=`<div class="card"><h3>Detail — ${esc(UNITS[du].nama)} (${esc(h.thU)})<span class="h3-actions no-print"><button class="btn sm" onclick="setFilter('lkUnit','')">✕ Tutup</button><button class="btn sm" onclick="expDetailUnit('${du}')">⬇ Excel</button><button class="btn sm" onclick="cetakDetailUnit('${du}')">🖨 Cetak</button></span></h3>${d.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c" style="width:40px">No</th><th>Tgl</th><th>Kategori</th><th>Keterangan</th><th class="r">Masuk</th><th class="r">Keluar</th><th class="r">Saldo</th></tr></thead><tbody>${dr}<tr class="tot-row"><td class="c"></td><td colspan="2">TOTAL</td><td></td><td class="r masuk">${rp(h.masuk)}</td><td class="r keluar">${rp(h.keluar)}</td><td class="r">${rp(h.akhir)}</td></tr></tbody></table></div>`:`<div class="empty">Tidak ada transaksi.</div>`}</div>`;
  }
  return h;
}
function expLaporanKetua(){const th=FILTER.lkTh||String(new Date().getFullYear());const rows=ALL_UNITS.map((un,i)=>{const thU=tahunUntukUnit(un,th);const m=DB.transaksi.filter(t=>t.unit===un&&t.tahun===thU&&t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);const k=DB.transaksi.filter(t=>t.unit===un&&t.tahun===thU&&t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);return [i+1,UNITS[un].nama,thU,saldoAwal(un,thU),m,k,saldoAwal(un,thU)+m-k];});exportExcel('laporan_lengkap_'+th,['No','Unit','Tahun','Saldo Awal','Masuk','Keluar','Saldo Akhir'],rows);}
function cetakLaporanKetua(){const th=FILTER.lkTh||String(new Date().getFullYear()),bl=FILTER.lkBl||'';const rows=ALL_UNITS.map((un,i)=>{const thU=tahunUntukUnit(un,th);const m=DB.transaksi.filter(t=>t.unit===un&&t.tahun===thU&&t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);const k=DB.transaksi.filter(t=>t.unit===un&&t.tahun===thU&&t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);return [i+1,UNITS[un].nama,thU,rp(saldoAwal(un,thU)),rp(m),rp(k),rp(saldoAwal(un,thU)+m-k)];});const ta=tanggalAkhirPeriode('yayasan',{th,bl});cetakPDF('LAPORAN LENGKAP SEMUA UNIT','Periode: '+th,['No','Unit','Tahun','Saldo Awal','Masuk','Keluar','Saldo Akhir'],rows,null,'yayasan',{tanggal:ta});}
function expDetailUnit(un){const th=FILTER.lkTh||String(new Date().getFullYear());const thU=tahunUntukUnit(un,th);let d=DB.transaksi.filter(t=>t.unit===un&&t.tahun===thU);d.sort((a,b)=>(a.tanggal||'')<(b.tanggal||'')?-1:1);exportExcel('detail_'+un+'_'+thU.replace('/','-'),['No','Tanggal','Jenis','Kategori','Keterangan','Jumlah'],d.map((t,i)=>[i+1,fmtTgl(t.tanggal),t.jenis==='masuk'?'Masuk':'Keluar',t.kategori,t.keterangan||'',Number(t.jumlah)]));}
function cetakDetailUnit(un){const th=FILTER.lkTh||String(new Date().getFullYear()),bl=FILTER.lkBl||'';const thU=tahunUntukUnit(un,th);let d=DB.transaksi.filter(t=>t.unit===un&&t.tahun===thU);d.sort((a,b)=>(a.tanggal||'')<(b.tanggal||'')?-1:1);const tm=d.filter(t=>t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);const tk=d.filter(t=>t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);const ta=tanggalAkhirPeriode(un,{th,bl});cetakPDF('LAPORAN DETAIL '+UNITS[un].nama.toUpperCase(),'Periode: '+thU,['No','Tanggal','Kategori','Keterangan','Pemasukan','Pengeluaran'],d.map((t,i)=>[i+1,fmtTgl(t.tanggal),t.kategori,t.keterangan||'-',t.jenis==='masuk'?rp(t.jumlah):'-',t.jenis==='keluar'?rp(t.jumlah):'-']),['','TOTAL','','',rp(tm),rp(tk)],un,{tanggal:ta});}
