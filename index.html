  const masuk = trs.filter(t=>t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);
  const keluar = trs.filter(t=>t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);
  const saldo = masuk - keluar;
  const target = Number(ev.target)||0;
  const persen = target>0 ? Math.min(100, Math.round(masuk/target*100)) : 0;
  const rows = trs.map((t,i)=>`<tr>
    <td class="c">${i+1}</td>
    <td>${fmtTgl(t.tanggal)}</td>
    <td><span class="badge ${t.jenis==='masuk'?'ok':'no'}">${t.jenis==='masuk'?'Masuk':'Keluar'}</span></td>
    <td>${esc(t.keterangan||'-')}</td>
    <td class="r ${t.jenis==='masuk'?'masuk':'keluar'}">${rp(t.jumlah)}</td>
    <td class="c no-print"><button class="btn xs danger" onclick="hapusEventTrans('${t.id}')">Hapus</button></td>
  </tr>`).join('');

  const btnMintaLabel = labelAmbilKas(u);
  const btnSetorLabel = labelSetorKas(u);
  const cardTitle = 'Dana Event & ' + labelKasUnit(u);
  const kasLabel = labelKasUnit(u);
  const saldoKas = saldoUnit(u, tahunAktif(u));

  return `
  <div class="card">
    <h3>🎉 ${esc(ev.nama)}
      <span class="h3-actions no-print"><button class="btn sm ghost" onclick="go('event')">← Kembali</button></span>
    </h3>
    <div style="font-size:12.5px;color:#64748b;margin-bottom:14px">
      ${fmtTgl(ev.tanggal)} | ${esc(ev.keterangan||'')}
      ${target>0?`<br>Target: <strong>${rp(target)}</strong> — ${persen}%`:''}
    </div>
    ${target>0?`<div class="bar" style="height:10px;margin-bottom:14px"><i style="width:${persen}%"></i></div>`:''}
    <div class="cards" style="margin-bottom:0">
      <div class="stat green"><span>Pemasukan</span><strong>${rp(masuk)}</strong></div>
      <div class="stat red"><span>Pengeluaran</span><strong>${rp(keluar)}</strong></div>
      <div class="stat"><span>Saldo</span><strong>${rp(saldo)}</strong></div>
      <div class="stat amber"><span>${esc(kasLabel)}</span><strong>${rp(saldoKas)}</strong></div>
    </div>
  </div>

  <div class="card no-print"><h3>➕ Input Transaksi Event</h3>
    <form onsubmit="tambahEventTrans(event)">
      <div class="form-grid">
        <div class="form-row"><label>Tanggal</label><input type="date" id="evtTanggal" value="${todayStr()}" required></div>
        <div class="form-row"><label>Jenis</label>
          <select id="evtJenis"><option value="masuk">Pemasukan</option><option value="keluar">Pengeluaran</option></select></div>
        <div class="form-row"><label>Jumlah</label><input type="number" id="evtJumlah" min="0" required></div>
      </div>
      <div class="form-row"><label>Keterangan</label><input id="evtKet"></div>
      <div class="form-actions"><button class="btn primary" type="submit">💾 Simpan</button></div>
    </form>
  </div>

  <div class="card">
    <h3>🔄 ${esc(cardTitle)}</h3>
    <div class="info-box" style="background:#fef3c7;border-left-color:#f59e0b">
      ⚡ <strong>Aksi langsung:</strong> Tombol di bawah akan <strong>langsung mengubah saldo ${esc(kasLabel)}</strong> dan otomatis tercatat di menu <strong>Transaksi</strong> serta riwayat event ini.
    </div>
    <div class="form-actions no-print">
      <button class="btn accent" onclick="formDanaEvent('minta')">📥 ${esc(btnMintaLabel)}</button>
      <button class="btn success" onclick="formDanaEvent('setor')">📤 ${esc(btnSetorLabel)}</button>
    </div>
  </div>

  <div class="card">
    <h3>Riwayat Transaksi
      <span class="h3-actions no-print">
        <button class="btn sm" onclick="expEventTrans()">⬇ Excel</button>
        <button class="btn sm" onclick="cetakEventTrans()">🖨 Cetak</button>
      </span>
    </h3>
    ${trs.length ? `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th class="c" style="width:40px">No</th><th>Tgl</th><th>Jenis</th><th>Keterangan</th><th class="r">Jumlah</th><th class="c no-print">Aksi</th></tr></thead>
      <tbody>${rows}<tr class="tot-row"><td class="c"></td><td colspan="2">TOTAL MASUK</td><td></td><td class="r masuk">${rp(masuk)}</td><td class="no-print"></td></tr>
        <tr class="tot-row"><td class="c"></td><td colspan="2">TOTAL KELUAR</td><td></td><td class="r keluar">${rp(keluar)}</td><td class="no-print"></td></tr>
        <tr class="tot-row"><td class="c"></td><td colspan="2">SALDO</td><td></td><td class="r">${rp(saldo)}</td><td class="no-print"></td></tr>
      </tbody></table></div>` : `<div class="empty">Belum ada.</div>`}
  </div>`;
}
function tambahEventTrans(e){
  e.preventDefault();
  const ev = DB.events.find(x=>x.id===state.eventId); if(!ev) return;
  DB.eventTrans.push({
    id:uid(), eventId:ev.id, unit:ev.unit,
    tanggal: document.getElementById('evtTanggal').value,
    jenis: document.getElementById('evtJenis').value,
    jumlah: Number(document.getElementById('evtJumlah').value)||0,
    keterangan: document.getElementById('evtKet').value.trim()
  });
  saveDB(); toast('Disimpan','ok'); render();
}
function hapusEventTrans(id){
  if(!confirm('Hapus?')) return;
  DB.eventTrans = DB.eventTrans.filter(t=>t.id!==id);
  saveDB(); toast('Dihapus','ok'); render();
}
function expEventTrans(){
  const ev = DB.events.find(x=>x.id===state.eventId); if(!ev) return;
  const trs = DB.eventTrans.filter(t=>t.eventId===ev.id);
  exportExcel('event_'+ev.nama.replace(/\s+/g,'_'), ['No','Tanggal','Jenis','Keterangan','Jumlah'],
    trs.map((t,i)=>[i+1, fmtTgl(t.tanggal), t.jenis==='masuk'?'Masuk':'Keluar', t.keterangan||'', Number(t.jumlah)]));
}
function cetakEventTrans(){
  const ev = DB.events.find(x=>x.id===state.eventId); if(!ev) return;
  const trs = DB.eventTrans.filter(t=>t.eventId===ev.id).sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? -1 : 1);
  const m = trs.filter(t=>t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);
  const k = trs.filter(t=>t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);
  cetakPDF('Laporan Event: ' + ev.nama, 'Tanggal: ' + fmtTgl(ev.tanggal),
    ['No','Tanggal','Jenis','Keterangan','Jumlah'],
    trs.map((t,i)=>[i+1, fmtTgl(t.tanggal), t.jenis==='masuk'?'Masuk':'Keluar', t.keterangan||'', rp(t.jumlah)]),
    ['','SALDO','','', rp(m-k)], ev.unit, { tanggal: ev.tanggal });
}

function formDanaEvent(jenis){
  const ev = DB.events.find(x=>x.id===state.eventId); if(!ev) return;
  const u = ev.unit;
  const saldo = saldoEvent(ev.id);
  const saldoKas = saldoUnit(u, tahunAktif(u));
  const judul = jenis === 'minta' ? labelAmbilKas(u) : labelSetorKas(u);
  const kasLabel = labelKasUnit(u);
  const defaultKet = jenis === 'minta'
    ? 'Ambil dana event: ' + ev.nama
    : 'Setor dana event: ' + ev.nama;
  const infoColor = jenis === 'minta' ? '#f59e0b' : '#16a34a';
  const infoText = jenis === 'minta'
    ? `Saldo ${kasLabel} akan <strong>berkurang</strong> dan saldo event <strong>bertambah</strong>.`
    : `Saldo ${kasLabel} akan <strong>bertambah</strong> dan saldo event <strong>berkurang</strong>.`;

  showModal(judul, `
    <div class="cards" style="margin-bottom:14px">
      <div class="stat"><span>Saldo Event</span><strong>${rp(saldo)}</strong></div>
      <div class="stat amber"><span>Saldo ${esc(kasLabel)}</span><strong>${rp(saldoKas)}</strong></div>
    </div>
    <div class="info-box" style="background:#fef3c7;border-left-color:${infoColor}">
      ⚡ ${infoText}
    </div>
    <div class="form-row"><label>Jumlah (Rp)</label>
      <input type="number" id="pmeJumlah" min="0" value=""></div>
    <div class="form-row"><label>Tanggal</label>
      <input type="date" id="pmeTanggal" value="${todayStr()}"></div>
    <div class="form-row"><label>Keterangan</label>
      <input id="pmeKet" placeholder="${esc(defaultKet)}"></div>
    <div class="form-actions">
      <button class="btn primary" onclick="kirimDanaEvent('${jenis}')">✓ Proses</button>
      <button class="btn ghost" onclick="closeModal()">Batal</button>
    </div>`);
}
function kirimDanaEvent(jenis){
  const ev = DB.events.find(x=>x.id===state.eventId); if(!ev) return;
  const u = ev.unit;
  const jumlah = Number(document.getElementById('pmeJumlah').value)||0;
  const tanggal = document.getElementById('pmeTanggal').value || todayStr();
  const ketUser = document.getElementById('pmeKet').value.trim();
  if(jumlah<=0){ toast('Jumlah tidak valid','error'); return; }

  const tahun = tahunDariTanggal(u, tanggal);
  if(!(DB.years[u]||[]).some(y=>y.tahun===tahun)){
    DB.years[u] = DB.years[u] || [];
    DB.years[u].push({ id:uid(), tahun, saldoAwal:0, aktif:false });
  }

  const kasLabel = labelKasUnit(u);
  if(jenis === 'minta'){
    const ket = ketUser || ('Ambil dana event: ' + ev.nama);
    tambahTransaksi(u, tahun, tanggal, 'keluar', 'Lain-lain', jumlah, ket);
    DB.eventTrans.push({
      id:uid(), eventId:ev.id, unit:u, tanggal,
      jenis:'masuk', jumlah,
      keterangan:'Ambil dari ' + kasLabel
    });
  } else {
    const ket = ketUser || ('Setor dana event: ' + ev.nama);
    tambahTransaksi(u, tahun, tanggal, 'masuk', 'Lain-lain', jumlah, ket);
    DB.eventTrans.push({
      id:uid(), eventId:ev.id, unit:u, tanggal,
      jenis:'keluar', jumlah,
      keterangan:'Setor ke ' + kasLabel
    });
  }
  saveDB(); closeModal();
  toast('✓ Berhasil: ' + (jenis==='minta' ? 'Ambil dari ' + kasLabel : 'Setor ke ' + kasLabel), 'ok');
  render();
}

function setujuiPermohonan(id){
  const p = DB.permohonan.find(x=>x.id===id);
  if(!p || p.status!=='pending') return;
  if(!confirm(`Setujui ${rp(p.jumlah)}?`)) return;
  const thY = tahunAktif('yayasan');
  const thU = tahunAktif(p.dari);
  const tgl = todayStr();
  const nmShort = shortUnitName(p.dari);
  const eventKet = p.eventNama ? ' - ' + p.eventNama : '';

  if(p.jenis === 'minta'){
    /* Yayasan mengeluarkan dana bantuan ke unit */
    const ketY = keteranganDenganCatatan('Bantuan ' + nmShort.toLowerCase() + eventKet, p.keterangan);
    tambahTransaksi('yayasan', thY, tgl, 'keluar', 'Bantuan Yayasan ke Unit', p.jumlah, ketY);

    if(p.eventId){
      DB.eventTrans.push({
        id:uid(), eventId:p.eventId, unit:p.dari, tanggal:tgl,
        jenis:'masuk', jumlah:p.jumlah,
        keterangan: keteranganDenganCatatan('Dana dari Yayasan', p.keterangan)
      });
    } else {
      const ketU = keteranganDenganCatatan('Dana dari Yayasan', p.keterangan);
      /* Unit menerima dana bantuan dari yayasan */
      tambahTransaksi(p.dari, thU, tgl, 'masuk', 'Bantuan Yayasan ke Unit', p.jumlah, ketU);
    }
  } else {
    /* Yayasan menerima setoran dari unit */
    const ketY = keteranganDenganCatatan('Setoran ' + nmShort.toLowerCase() + eventKet, p.keterangan);
    tambahTransaksi('yayasan', thY, tgl, 'masuk', 'Setor Unit ke Yayasan', p.jumlah, ketY);

    if(p.eventId){
      DB.eventTrans.push({
        id:uid(), eventId:p.eventId, unit:p.dari, tanggal:tgl,
        jenis:'keluar', jumlah:p.jumlah,
        keterangan: keteranganDenganCatatan('Setor ke Kas Yayasan', p.keterangan)
      });
    } else {
      const ketU = keteranganDenganCatatan('Setoran ke Yayasan', p.keterangan);
      /* Unit menyetorkan dana ke yayasan */
      tambahTransaksi(p.dari, thU, tgl, 'keluar', 'Setor Unit ke Yayasan', p.jumlah, ketU);
    }
  }

  p.status = 'approved'; p.approvedAt = tgl; p.approvedBy = state.user.nama;
  saveDB(); toast('Disetujui','ok'); render();
}
function tolakPermohonan(id){
  const p = DB.permohonan.find(x=>x.id===id); if(!p) return;
  if(!confirm('Tolak?')) return;
  p.status = 'rejected'; p.approvedBy = state.user.nama; p.approvedAt = todayStr();
  saveDB(); toast('Ditolak','ok'); render();
}

function pageLaporan(){
  const u = state.ctxUnit;
  const tipe = UNITS[u].tipe;
  const role = state.user.role;

  const jenisOpts = [
    { v:'kas',      l:'Laporan Arus Kas (Detail)' },
    { v:'rekapkas', l:'Laporan Rekapitulasi Arus Kas' },
    { v:'kategori', l:'Laporan Rekap per Kategori' },
    { v:'keuangan', l:'Laporan Keuangan (Ringkasan)' },
    { v:'event',    l:'Laporan Event / Donasi' }
  ];
  if(tipe === 'yayasan') jenisOpts.push({ v:'unit', l:'Rekap Saldo Seluruh Unit' });
  if(tipe === 'yayasan' && role !== 'jamaah') jenisOpts.push({ v:'pajak', l:'Laporan Pajak (SPT PPh Badan)' });
  if(tipe === 'mahad')   jenisOpts.push({ v:'siswa', l:'Laporan Pembayaran Siswa' });

  const jenis = FILTER.lapJenis || 'kas';

  if(jenis === 'keuangan'){
    return renderLaporanJenisSelector(jenisOpts, jenis) + pageLaporanKeuangan(u);
  }
  if(jenis === 'pajak'){
    if(role === 'jamaah'){
      return '<div class="card"><div class="empty">Anda tidak memiliki akses ke halaman ini.</div></div>';
    }
    return renderLaporanJenisSelector(jenisOpts, jenis) + pageLaporanPajak(u);
  }

  const th = FILTER.lapTahun || tahunAktif(u);
  const bl = FILTER.lapBulan || '';
  const tahunList = Array.from(new Set([
    ...(DB.years[u]||[]).map(y=>y.tahun),
    ...DB.transaksi.filter(t=>t.unit===u).map(t=>t.tahun),
    currentTahun(u)
  ])).sort();

  let html = `<div class="card no-print"><h3>📈 Parameter Laporan</h3>
    <div class="filters">
      <div><label>Jenis</label>
        <select onchange="setFilter('lapJenis',this.value)">
          ${jenisOpts.map(o=>`<option value="${o.v}" ${o.v===jenis?'selected':''}>${esc(o.l)}</option>`).join('')}
        </select></div>
      <div><label>Tahun</label>
        <select onchange="setFilter('lapTahun',this.value)">
          ${tahunList.map(t=>`<option value="${t}" ${t===th?'selected':''}>${esc(t)}</option>`).join('')}
        </select></div>
      <div><label>Periode</label>
        <select onchange="setFilter('lapBulan',this.value)">
          <option value="">Tahunan</option>
          ${BULAN.map((b,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${String(i+1).padStart(2,'0')===bl?'selected':''}>${b}</option>`).join('')}
        </select></div>
    </div>
  </div>`;

  if(jenis === 'kas'){
    const periodeLbl = bl ? `${BULAN[Number(bl)-1]} ${th}` : `Tahun ${th}`;
    let data = DB.transaksi.filter(t=>t.unit===u && t.tahun===th);
    if(bl) data = data.filter(t=>(t.tanggal||'').slice(5,7)===bl);
    data.sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? -1 : 1);

    let sa = saldoAwal(u, th);
    if(bl){
      DB.transaksi.filter(t=>t.unit===u && t.tahun===th && (t.tanggal||'').slice(5,7) < bl)
        .forEach(t=> sa += t.jenis==='masuk' ? Number(t.jumlah) : -Number(t.jumlah));
    }
    let running = sa;
    const rows = data.map((t,i)=>{
      running += t.jenis==='masuk' ? Number(t.jumlah) : -Number(t.jumlah);
      return `<tr>
        <td class="c">${i+1}</td>
        <td>${fmtTgl(t.tanggal)}</td>
        <td>${esc(t.kategori)}</td>
        <td>${esc(t.keterangan||'-')}</td>
        <td class="r masuk">${t.jenis==='masuk'?rp(t.jumlah):'-'}</td>
        <td class="r keluar">${t.jenis==='keluar'?rp(t.jumlah):'-'}</td>
        <td class="r"><strong>${rp(running)}</strong></td></tr>`;
    }).join('');
    const tm = data.filter(t=>t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);
    const tk = data.filter(t=>t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);

    html += `<div class="card">
      <h3>Laporan Arus Kas — ${esc(periodeLbl)}
        <span class="h3-actions no-print">
          <button class="btn sm" onclick="expLapKas()">⬇ Excel</button>
          <button class="btn sm" onclick="cetakLapKas()">🖨 Cetak</button>
        </span>
      </h3>
      <div class="cards" style="margin-bottom:14px">
        <div class="stat"><span>Saldo Awal</span><strong>${rp(sa)}</strong></div>
        <div class="stat green"><span>Pemasukan</span><strong>${rp(tm)}</strong></div>
        <div class="stat red"><span>Pengeluaran</span><strong>${rp(tk)}</strong></div>
        <div class="stat amber"><span>Saldo Akhir</span><strong>${rp(sa+tm-tk)}</strong></div>
      </div>
      ${data.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th class="c" style="width:40px">No</th><th>Tgl</th><th>Kategori</th><th>Keterangan</th><th class="r">Masuk</th><th class="r">Keluar</th><th class="r">Saldo</th></tr></thead>
        <tbody>${rows}<tr class="tot-row"><td class="c"></td><td colspan="2">TOTAL</td><td></td><td class="r masuk">${rp(tm)}</td><td class="r keluar">${rp(tk)}</td><td class="r">${rp(sa+tm-tk)}</td></tr></tbody>
      </table></div>` : `<div class="empty">Tidak ada transaksi.</div>`}
    </div>`;
  }

  else if(jenis === 'rekapkas'){
    const periodeLbl = bl ? `${BULAN[Number(bl)-1]} ${th}` : `Tahun ${th}`;
    const rekapBulan = BULAN.map((namaBulan, i)=>{
      const bl2 = String(i+1).padStart(2,'0');
      let data = DB.transaksi.filter(t=>t.unit===u && t.tahun===th && (t.tanggal||'').slice(5,7)===bl2);
      const m = data.filter(t=>t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);
      const k = data.filter(t=>t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);
      return { bulan:namaBulan, masuk:m, keluar:k, selisih:m-k };
    });
    const totalMasuk = rekapBulan.reduce((a,b)=>a+b.masuk,0);
    const totalKeluar = rekapBulan.reduce((a,b)=>a+b.keluar,0);
    const saldoAkhirTotal = saldoAwal(u, th) + totalMasuk - totalKeluar;

    html += `
    <div class="cards">
      <div class="stat"><span>Saldo Awal ${esc(th)}</span><strong>${rp(saldoAwal(u, th))}</strong></div>
      <div class="stat green"><span>Total Pemasukan</span><strong>${rp(totalMasuk)}</strong></div>
      <div class="stat red"><span>Total Pengeluaran</span><strong>${rp(totalKeluar)}</strong></div>
      <div class="stat amber"><span>Saldo Akhir</span><strong>${rp(saldoAkhirTotal)}</strong></div>
    </div>

    <div class="card">
      <h3>📊 Rekapitulasi Arus Kas per Bulan — ${esc(periodeLbl)}
        <span class="h3-actions no-print">
          <button class="btn sm" onclick="expRekapKas()">⬇ Excel</button>
          <button class="btn sm" onclick="cetakRekapKas()">🖨 Cetak/PDF</button>
        </span>
      </h3>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr>
          <th class="c" style="width:40px">No</th>
          <th>Bulan</th>
          <th class="r">Pemasukan</th>
          <th class="r">Pengeluaran</th>
          <th class="r">Selisih</th>
          <th class="r">Saldo Kumulatif</th>
        </tr></thead>
        <tbody>
          <tr class="tot-row">
            <td class="c"></td>
            <td><strong>Saldo Awal</strong></td>
            <td class="r" colspan="3">—</td>
            <td class="r"><strong>${rp(saldoAwal(u, th))}</strong></td>
          </tr>
          ${(()=>{
            let kumulatif = saldoAwal(u, th);
            return rekapBulan.map((r,i)=>{
              kumulatif += r.selisih;
              return `<tr>
                <td class="c">${i+1}</td>
                <td>${esc(r.bulan)}</td>
                <td class="r masuk">${r.masuk?rp(r.masuk):'-'}</td>
                <td class="r keluar">${r.keluar?rp(r.keluar):'-'}</td>
                <td class="r ${r.selisih>=0?'masuk':'keluar'}">${rp(r.selisih)}</td>
                <td class="r"><strong>${rp(kumulatif)}</strong></td>
              </tr>`;
            }).join('');
          })()}
          <tr class="tot-row">
            <td class="c"></td>
            <td>TOTAL</td>
            <td class="r">${rp(totalMasuk)}</td>
            <td class="r">${rp(totalKeluar)}</td>
            <td class="r">${rp(totalMasuk-totalKeluar)}</td>
            <td class="r">${rp(saldoAkhirTotal)}</td>
          </tr>
        </tbody>
      </table></div>
    </div>`;
  }

  else if(jenis === 'kategori'){
    const periodeLbl = bl ? `${BULAN[Number(bl)-1]} ${th}` : `Tahun ${th}`;
    let dataTh = DB.transaksi.filter(t=>t.unit===u && t.tahun===th);
    if(bl) dataTh = dataTh.filter(t=>(t.tanggal||'').slice(5,7)===bl);

    const katMap = {};
    dataTh.forEach(t=>{
      katMap[t.kategori] = katMap[t.kategori] || { masuk:0, keluar:0 };
      if(t.jenis === 'masuk'){ katMap[t.kategori].masuk += Number(t.jumlah); }
      else { katMap[t.kategori].keluar += Number(t.jumlah); }
    });

    const keys = Object.keys(katMap).sort();
    const rows = keys.map((k,i)=>{
      const r = katMap[k];
      const selisih = r.masuk - r.keluar;
      return `<tr>
        <td class="c">${i+1}</td>
        <td><strong>${esc(k)}</strong></td>
        <td class="r masuk">${r.masuk ? rp(r.masuk) : '-'}</td>
        <td class="r keluar">${r.keluar ? rp(r.keluar) : '-'}</td>
        <td class="r ${selisih>=0?'masuk':'keluar'}"><strong>${rp(selisih)}</strong></td>
      </tr>`;
    }).join('');

    const totalMasuk = keys.reduce((a,k)=>a+katMap[k].masuk,0);
    const totalKeluar = keys.reduce((a,k)=>a+katMap[k].keluar,0);

    const masukRows = keys.filter(k=>katMap[k].masuk > 0).map((k,i)=>`
      <tr><td class="c">${i+1}</td><td>${esc(k)}</td>
      <td class="r masuk"><strong>${rp(katMap[k].masuk)}</strong></td></tr>`).join('');
    const keluarRows = keys.filter(k=>katMap[k].keluar > 0).map((k,i)=>`
      <tr><td class="c">${i+1}</td><td>${esc(k)}</td>
      <td class="r keluar"><strong>${rp(katMap[k].keluar)}</strong></td></tr>`).join('');

    html += `
    <div class="cards">
      <div class="stat green"><span>Total Pemasukan</span><strong>${rp(totalMasuk)}</strong></div>
      <div class="stat red"><span>Total Pengeluaran</span><strong>${rp(totalKeluar)}</strong></div>
      <div class="stat amber"><span>Selisih</span><strong>${rp(totalMasuk-totalKeluar)}</strong></div>
      <div class="stat"><span>Jumlah Kategori</span><strong>${num(keys.length)}</strong></div>
    </div>

    <div class="card">
      <h3>📊 Rekap per Kategori — ${esc(periodeLbl)}
        <span class="h3-actions no-print">
          <button class="btn sm" onclick="expLapKategori()">⬇ Excel</button>
          <button class="btn sm" onclick="cetakLapKategori()">🖨 Cetak</button>
        </span>
      </h3>
      ${keys.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr>
          <th class="c" style="width:40px">No</th>
          <th>Kategori</th>
          <th class="r">Pemasukan</th>
          <th class="r">Pengeluaran</th>
          <th class="r">Selisih</th>
        </tr></thead>
        <tbody>${rows}
          <tr class="tot-row">
            <td class="c"></td>
            <td>TOTAL</td>
            <td class="r">${rp(totalMasuk)}</td>
            <td class="r">${rp(totalKeluar)}</td>
            <td class="r">${rp(totalMasuk-totalKeluar)}</td>
          </tr>
        </tbody>
      </table></div>` : `<div class="empty">Tidak ada data transaksi pada periode ini.</div>`}
    </div>

    ${(masukRows || keluarRows) ? `
    <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
      <div class="card" style="margin-bottom:0">
        <h3>🟢 Ringkasan Pemasukan</h3>
        ${masukRows ? `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th class="c" style="width:40px">No</th><th>Kategori</th><th class="r">Total</th></tr></thead>
          <tbody>${masukRows}
            <tr class="tot-row"><td class="c"></td><td>TOTAL</td><td class="r">${rp(totalMasuk)}</td></tr>
          </tbody>
        </table></div>` : `<div class="empty">Tidak ada pemasukan.</div>`}
      </div>
      <div class="card" style="margin-bottom:0">
        <h3>🔴 Ringkasan Pengeluaran</h3>
        ${keluarRows ? `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th class="c" style="width:40px">No</th><th>Kategori</th><th class="r">Total</th></tr></thead>
          <tbody>${keluarRows}
            <tr class="tot-row"><td class="c"></td><td>TOTAL</td><td class="r">${rp(totalKeluar)}</td></tr>
          </tbody>
        </table></div>` : `<div class="empty">Tidak ada pengeluaran.</div>`}
      </div>
    </div>` : ''}
    `;
  }

  else if(jenis === 'event'){
    const evs = DB.events.filter(e=>e.unit===u).sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? 1 : -1);
    const rows = evs.map((e,i)=>{
      const m = DB.eventTrans.filter(t=>t.eventId===e.id&&t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);
      const k = DB.eventTrans.filter(t=>t.eventId===e.id&&t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);
      return `<tr><td class="c">${i+1}</td><td>${esc(e.nama)}</td><td>${fmtTgl(e.tanggal)}</td>
        <td class="r masuk">${rp(m)}</td><td class="r keluar">${rp(k)}</td><td class="r"><strong>${rp(m-k)}</strong></td></tr>`;
    }).join('');
    const tme = evs.reduce((a,e)=>a+DB.eventTrans.filter(t=>t.eventId===e.id&&t.jenis==='masuk').reduce((x,y)=>x+Number(y.jumlah),0),0);
    const tke = evs.reduce((a,e)=>a+DB.eventTrans.filter(t=>t.eventId===e.id&&t.jenis==='keluar').reduce((x,y)=>x+Number(y.jumlah),0),0);
    html += `<div class="card">
      <h3>Laporan Event / Donasi
        <span class="h3-actions no-print">
          <button class="btn sm" onclick="expLapEvent()">⬇ Excel</button>
          <button class="btn sm" onclick="cetakLapEvent()">🖨 Cetak</button>
        </span>
      </h3>
      ${evs.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th class="c" style="width:40px">No</th><th>Event</th><th>Tanggal</th><th class="r">Pemasukan</th><th class="r">Pengeluaran</th><th class="r">Saldo</th></tr></thead>
        <tbody>${rows}<tr class="tot-row"><td class="c"></td><td colspan="2">TOTAL</td><td class="r">${rp(tme)}</td><td class="r">${rp(tke)}</td><td class="r">${rp(tme-tke)}</td></tr></tbody>
      </table></div>` : `<div class="empty">Belum ada event.</div>`}
    </div>`;
  }

  else if(jenis === 'unit'){
    let totalSaldo = 0;
    const rows = ALL_UNITS.map((un,i)=>{
      const t = tahunAktif(un);
      const sa = saldoAwal(un, t);
      const m = DB.transaksi.filter(x=>x.unit===un&&x.tahun===t&&x.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);
      const k = DB.transaksi.filter(x=>x.unit===un&&x.tahun===t&&x.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);
      const akhir = sa+m-k;
      if(un !== 'yayasan') totalSaldo += akhir;
      return `<tr><td class="c">${i+1}</td><td><strong>${esc(UNITS[un].nama)}</strong></td><td class="c">${esc(t)}</td>
        <td class="r">${rp(sa)}</td><td class="r masuk">${rp(m)}</td><td class="r keluar">${rp(k)}</td>
        <td class="r"><strong>${rp(akhir)}</strong></td></tr>`;
    }).join('');
    html += `<div class="card">
      <h3>Rekap Saldo Seluruh Unit
        <span class="h3-actions no-print">
          <button class="btn sm" onclick="expRekapUnit()">⬇ Excel</button>
          <button class="btn sm" onclick="cetakRekapUnit()">🖨 Cetak</button>
        </span>
      </h3>
      <div class="tbl-wrap"><table class="tbl">
        <thead><tr><th class="c" style="width:40px">No</th><th>Unit</th><th class="c">Tahun</th><th class="r">Saldo Awal</th><th class="r">Masuk</th><th class="r">Keluar</th><th class="r">Saldo Akhir</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="hint">Total saldo unit (tanpa yayasan): <strong>${rp(totalSaldo)}</strong></div>
    </div>`;
  }

  else if(jenis === 'siswa'){
    const list = DB.siswa.filter(s=>s.unit===u).sort((a,b)=> (a.tingkat+'').localeCompare(b.tingkat+'') || a.nama.localeCompare(b.nama));
    const rows = list.map((s,i)=>{
      const b = KOMPONEN_DEFAULT.map(k=>hitungBayarKomponen(s.id,k));
      const tot = b.reduce((a,c)=>a+c,0);
      return `<tr><td class="c">${i+1}</td><td>${esc(s.nis)}</td><td>${esc(s.nama)}</td><td class="c">${esc(s.tingkat)}</td>
        ${b.map(v=>`<td class="r ${v>0?'masuk':''}">${v?rp(v):'-'}</td>`).join('')}
        <td class="r"><strong>${rp(tot)}</strong></td></tr>`;
    }).join('');
    const totK = KOMPONEN_DEFAULT.map(k=> list.reduce((a,s)=>a+hitungBayarKomponen(s.id,k),0));
    const grand = totK.reduce((a,b)=>a+b,0);
    html += `<div class="card">
      <h3>Laporan Pembayaran Siswa per Komponen
        <span class="h3-actions no-print">
          <button class="btn sm" onclick="expLapSiswa()">⬇ Excel</button>
          <button class="btn sm" onclick="cetakLapSiswa()">🖨 Cetak</button>
        </span>
      </h3>
      ${list.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th class="c" style="width:40px">No</th><th>NIS</th><th>Nama</th><th class="c">Tkt</th>${KOMPONEN_DEFAULT.map(k=>`<th class="r">${esc(k)}</th>`).join('')}<th class="r">Total</th></tr></thead>
        <tbody>${rows}<tr class="tot-row"><td class="c"></td><td colspan="3">TOTAL</td>${totK.map(v=>`<td class="r">${rp(v)}</td>`).join('')}<td class="r">${rp(grand)}</td></tr></tbody>
      </table></div>` : `<div class="empty">Belum ada siswa.</div>`}
    </div>`;
  }
  return html;
}

/* =========================================================
   15b. LAPORAN KEUANGAN
   ========================================================= */
function pageLaporanKeuangan(unitOverride){
  const u = unitOverride || state.ctxUnit;
  const th = FILTER.lkTh || tahunAktif(u);
  const bl = FILTER.lkBulan || '';

  const tahunList = Array.from(new Set([
    ...(DB.years[u]||[]).map(y=>y.tahun),
    ...DB.transaksi.filter(t=>t.unit===u).map(t=>t.tahun),
    currentTahun(u)
  ])).sort();

  let kasAwal = saldoAwal(u, th);
  if(bl){
    DB.transaksi.filter(t=>t.unit===u && t.tahun===th && (t.tanggal||'').slice(5,7) < bl)
      .forEach(t=> kasAwal += t.jenis==='masuk' ? Number(t.jumlah) : -Number(t.jumlah));
  }

  let data = DB.transaksi.filter(t=>t.unit===u && t.tahun===th);
  if(bl) data = data.filter(t=>(t.tanggal||'').slice(5,7)===bl);

  const katMap = {};
  data.forEach(t=>{
    katMap[t.kategori] = katMap[t.kategori] || { masuk:0, keluar:0 };
    if(t.jenis==='masuk') katMap[t.kategori].masuk += Number(t.jumlah);
    else katMap[t.kategori].keluar += Number(t.jumlah);
  });
  const keys = Object.keys(katMap).sort();
  const totalMasuk = keys.reduce((a,k)=>a+katMap[k].masuk,0);
  const totalKeluar = keys.reduce((a,k)=>a+katMap[k].keluar,0);
  const saldoAkhir = kasAwal + totalMasuk - totalKeluar;
  const periodeLbl = bl ? `${BULAN[Number(bl)-1]} ${th}` : `Tahun ${th}`;
  const isOverride = !!unitOverride;

  const katRows = keys.length ? keys.map((k,i)=>{
    const r = katMap[k];
    const sub = r.masuk - r.keluar;
    return `<tr>
      <td class="c">${i+1}</td>
      <td><strong>${esc(k)}</strong></td>
      <td class="r masuk">${r.masuk?rp(r.masuk):'-'}</td>
      <td class="r keluar">${r.keluar?rp(r.keluar):'-'}</td>
      <td class="r ${sub>=0?'masuk':'keluar'}"><strong>${rp(sub)}</strong></td>
    </tr>`;
  }).join('') : `<tr><td colspan="5" class="empty">Tidak ada transaksi pada periode ini.</td></tr>`;

  const judul = isOverride ? 'Laporan Keuangan — ' + UNITS[u].nama : 'Laporan Keuangan';

  const filterHtml = isOverride ? '' : `
    <div class="card no-print"><h3>💰 ${esc(judul)}</h3>
      <div class="filters">
        <div><label>Tahun</label>
          <select onchange="setFilter('lkTh',this.value)">
            ${tahunList.map(t=>`<option value="${t}" ${t===th?'selected':''}>${esc(t)}</option>`).join('')}
          </select></div>
        <div><label>Periode</label>
          <select onchange="setFilter('lkBulan',this.value)">
            <option value="">Tahunan</option>
            ${BULAN.map((b,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${String(i+1).padStart(2,'0')===bl?'selected':''}>${b}</option>`).join('')}
          </select></div>
        <div><label>&nbsp;</label>
          <button class="btn sm" onclick="expLapKeuangan('${u}')">⬇ Excel</button></div>
        <div><label>&nbsp;</label>
          <button class="btn sm" onclick="cetakLapKeuangan('${u}')">🖨 Cetak/PDF</button></div>
      </div>
      <div class="hint">Menampilkan kas awal, arus kas per kategori, dan saldo akhir untuk unit <strong>${esc(UNITS[u].nama)}</strong>.</div>
    </div>`;

  const actionHtml = isOverride ? `
    <div class="form-actions no-print" style="margin-bottom:14px">
      <button class="btn sm" onclick="expLapKeuangan('${u}')">⬇ Excel</button>
      <button class="btn sm" onclick="cetakLapKeuangan('${u}')">🖨 Cetak/PDF</button>
    </div>` : '';

  return `
  ${filterHtml}
  ${actionHtml}
  <div class="cards">
    <div class="stat"><span>Kas Awal</span><strong>${rp(kasAwal)}</strong><small>${esc(periodeLbl)}</small></div>
    <div class="stat green"><span>Total Pemasukan</span><strong>${rp(totalMasuk)}</strong></div>
    <div class="stat red"><span>Total Pengeluaran</span><strong>${rp(totalKeluar)}</strong></div>
    <div class="stat amber"><span>Saldo Akhir</span><strong>${rp(saldoAkhir)}</strong></div>
  </div>

  <div class="card">

function hitungDataPajak(unit, tahun){
  const data = DB.transaksi.filter(t=>t.unit===unit && t.tahun===tahun);
  const katMasuk = {}, katKeluar = {};
  data.forEach(t=>{
    if(t.jenis==='masuk') katMasuk[t.kategori] = (katMasuk[t.kategori]||0) + Number(t.jumlah);
    else katKeluar[t.kategori] = (katKeluar[t.kategori]||0) + Number(t.jumlah);
  });

  const totalMasuk = Object.values(katMasuk).reduce((a,b)=>a+b,0);
  const totalKeluar = Object.values(katKeluar).reduce((a,b)=>a+b,0);

  const rincianMasuk = Object.entries(katMasuk)
    .map(([kat,jml])=>({ kategori:kat, jumlah:jml,
      objekPajak: !KATEGORI_BUKAN_OBJEK_PAJAK.includes(kat) }))
    .sort((a,b)=> (a.objekPajak===b.objekPajak) ? 0 : (a.objekPajak ? -1 : 1));
  const rincianKeluar = Object.entries(katKeluar)
    .map(([kat,jml])=>({ kategori:kat, jumlah:jml }))
    .sort((a,b)=> b.jumlah - a.jumlah);

  const penerimaanObjek = rincianMasuk.filter(r=>r.objekPajak).reduce((a,b)=>a+b.jumlah,0);
  const penerimaanNonObjek = totalMasuk - penerimaanObjek;
  const biayaFiskal = totalKeluar;
  const penghasilanNetoKomersial = totalMasuk - totalKeluar;
  const penghasilanNetoFiskal = Math.max(0, penerimaanObjek - biayaFiskal);
  const tarif = 0.22;
  const pphTerutang = penghasilanNetoFiskal * tarif;

  return {
    data, katMasuk, katKeluar, rincianMasuk, rincianKeluar,
    totalMasuk, totalKeluar, penerimaanObjek, penerimaanNonObjek,
    biayaFiskal, penghasilanNetoKomersial, penghasilanNetoFiskal,
    tarif, pphTerutang
  };
}

function pageLaporanKetua(){
  const th = FILTER.lkTh || String(new Date().getFullYear());
  const bl = FILTER.lkBl || '';
  const detailUnit = FILTER.lkUnit || '';
  const tahunList = Array.from(new Set([
    ...ALL_UNITS.flatMap(un => (DB.years[un]||[]).map(y=>y.tahun)),
    ...DB.transaksi.map(t=>t.tahun),
    String(new Date().getFullYear())
  ])).sort();

  function hitungUnit(un){
    const thU = tahunUntukUnit(un, th);
    let data = DB.transaksi.filter(t=>t.unit===un && t.tahun===thU);
    if(bl) data = data.filter(t=>(t.tanggal||'').slice(5,7)===bl);
    const m = data.filter(t=>t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);
    const k = data.filter(t=>t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);
    let sa = saldoAwal(un, thU);
    if(bl){
      DB.transaksi.filter(t=>t.unit===un && t.tahun===thU && (t.tanggal||'').slice(5,7) < bl)
        .forEach(t=> sa += t.jenis==='masuk' ? Number(t.jumlah) : -Number(t.jumlah));
    }
    return { masuk:m, keluar:k, sa, akhir: sa+m-k, data, thU };
  }
  const hasil = ALL_UNITS.map(un => ({ un, ...hitungUnit(un) }));
  const tM = hasil.reduce((a,h)=>a+h.masuk,0);
  const tK = hasil.reduce((a,h)=>a+h.keluar,0);
  const tA = hasil.reduce((a,h)=>a+h.akhir,0);
  const periodeLbl = bl ? `${BULAN[Number(bl)-1]} ${th}` : `Tahun ${th}`;

  let html = `
  <div class="card no-print"><h3>📚 Laporan Lengkap Semua Unit</h3>
    <div class="filters">
      <div><label>Tahun</label>
        <select onchange="setFilter('lkTh',this.value)">
          ${tahunList.map(t=>`<option value="${t}" ${t===th?'selected':''}>${esc(t)}</option>`).join('')}
        </select></div>
      <div><label>Periode</label>
        <select onchange="setFilter('lkBl',this.value)">
          <option value="">Tahunan</option>
          ${BULAN.map((b,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${String(i+1).padStart(2,'0')===bl?'selected':''}>${b}</option>`).join('')}
        </select></div>
      <div><label>Detail Unit</label>
        <select onchange="setFilter('lkUnit',this.value)">
          <option value="">— Ringkasan —</option>
          ${ALL_UNITS.map(un=>`<option value="${un}" ${un===detailUnit?'selected':''}>${esc(UNITS[un].nama)}</option>`).join('')}
        </select></div>
    </div>
    <div class="form-actions" style="margin-top:14px">
      <button class="btn sm" onclick="expLaporanKetua()">⬇ Excel</button>
      <button class="btn sm" onclick="cetakLaporanKetua()">🖨 Cetak</button>
    </div>
    <div class="hint">💡 Tahun otomatis dikonversi untuk unit SD/TK (format "YYYY/YYYY").</div>
  </div>

  <div class="cards">
    <div class="stat purple"><span>Total Pemasukan</span><strong>${rp(tM)}</strong><small>${esc(periodeLbl)}</small></div>
    <div class="stat red"><span>Total Pengeluaran</span><strong>${rp(tK)}</strong></div>
    <div class="stat green"><span>Total Saldo Akhir</span><strong>${rp(tA)}</strong></div>
    <div class="stat amber"><span>Jumlah Transaksi</span><strong>${num(hasil.reduce((a,h)=>a+h.data.length,0))}</strong></div>
  </div>`;

  const rows = hasil.map((h,i)=>`<tr>
    <td class="c">${i+1}</td>
    <td><strong>${esc(UNITS[h.un].nama)}</strong></td>
    <td class="c">${esc(h.thU)}</td>
    <td class="r">${rp(h.sa)}</td>
    <td class="r masuk">${rp(h.masuk)}</td>
    <td class="r keluar">${rp(h.keluar)}</td>
    <td class="r"><strong>${rp(h.akhir)}</strong></td>
    <td class="c no-print"><button class="btn xs primary" onclick="setFilter('lkUnit','${h.un}')">Detail</button></td>
  </tr>`).join('');

  html += `<div class="card"><h3>Ringkasan — ${esc(periodeLbl)}</h3>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th class="c" style="width:40px">No</th><th>Unit</th><th class="c">Tahun</th><th class="r">Saldo Awal</th><th class="r">Masuk</th><th class="r">Keluar</th><th class="r">Saldo Akhir</th><th class="c no-print">Aksi</th></tr></thead>
      <tbody>${rows}<tr class="tot-row"><td class="c"></td><td colspan="2">TOTAL</td><td class="r">-</td><td class="r">${rp(tM)}</td><td class="r">${rp(tK)}</td><td class="r">${rp(tA)}</td><td class="no-print"></td></tr></tbody>
    </table></div>
  </div>`;

  if(detailUnit && UNITS[detailUnit]){
    const h = hasil.find(x=>x.un===detailUnit);
    const data = h.data.sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? -1 : 1);
    let running = h.sa;
    const detailRows = data.map((t,i)=>{
      running += t.jenis==='masuk' ? Number(t.jumlah) : -Number(t.jumlah);
      return `<tr><td class="c">${i+1}</td><td>${fmtTgl(t.tanggal)}</td><td>${esc(t.kategori)}</td><td>${esc(t.keterangan||'-')}</td>

        <td class="r"><strong>${rp(running)}</strong></td></tr>`;
    }).join('');
    html += `<div class="card">
      <h3>Detail — ${esc(UNITS[detailUnit].nama)} (${esc(h.thU)})
        <span class="h3-actions no-print">
          <button class="btn sm" onclick="setFilter('lkUnit','')">✕ Tutup</button>
          <button class="btn sm" onclick="expDetailUnit('${detailUnit}')">⬇ Excel</button>
          <button class="btn sm" onclick="cetakDetailUnit('${detailUnit}')">🖨 Cetak</button>
        </span>
      </h3>
      ${data.length ? `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th class="c" style="width:40px">No</th><th>Tgl</th><th>Kategori</th><th>Keterangan</th><th class="r">Masuk</th><th class="r">Keluar</th><th class="r">Saldo</th></tr></thead>
        <tbody>${detailRows}
          <tr class="tot-row"><td class="c"></td><td colspan="2">TOTAL</td><td></td>
            <td class="r masuk">${rp(h.masuk)}</td>
            <td class="r keluar">${rp(h.keluar)}</td>
            <td class="r">${rp(h.akhir)}</td></tr>
        </tbody></table></div>` : `<div class="empty">Tidak ada transaksi pada periode ini.</div>`}
    </div>`;
  }
  return html;
}

    const m = DB.transaksi.filter(t=>t.unit===un&&t.tahun===thU&&t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);
    const k = DB.transaksi.filter(t=>t.unit===un&&t.tahun===thU&&t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);
    return [i+1, UNITS[un].nama, thU, rp(saldoAwal(un,thU)), rp(m), rp(k), rp(saldoAwal(un,thU)+m-k)];
  });
  const tglAkhir = tanggalAkhirPeriode('yayasan', { th, bl });
  cetakPDF('LAPORAN LENGKAP SEMUA UNIT', 'Periode: ' + th,
    ['No','Unit','Tahun','Saldo Awal','Masuk','Keluar','Saldo Akhir'], rows,
    null, 'yayasan', { tanggal: tglAkhir });
}
function expDetailUnit(un){
  const th = FILTER.lkTh || String(new Date().getFullYear());
  const thU = tahunUntukUnit(un, th);
  let data = DB.transaksi.filter(t=>t.unit===un && t.tahun===thU);
  data.sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? -1 : 1);
  exportExcel('detail_'+un+'_'+thU.replace('/','-'), ['No','Tanggal','Jenis','Kategori','Keterangan','Jumlah'],
    data.map((t,i)=>[i+1, fmtTgl(t.tanggal), t.jenis==='masuk'?'Masuk':'Keluar', t.kategori, t.keterangan||'', Number(t.jumlah)]));
}
function cetakDetailUnit(un){
  const th = FILTER.lkTh || String(new Date().getFullYear());
  const bl = FILTER.lkBl || '';
  const thU = tahunUntukUnit(un, th);
  let data = DB.transaksi.filter(t=>t.unit===un && t.tahun===thU);
  data.sort((a,b)=> (a.tanggal||'') < (b.tanggal||'') ? -1 : 1);
  const tm = data.filter(t=>t.jenis==='masuk').reduce((a,b)=>a+Number(b.jumlah),0);
  const tk = data.filter(t=>t.jenis==='keluar').reduce((a,b)=>a+Number(b.jumlah),0);
  const tglAkhir = tanggalAkhirPeriode(un, { th, bl });
  cetakPDF('LAPORAN DETAIL ' + UNITS[un].nama.toUpperCase(), 'Periode: ' + thU,
    ['No','Tanggal','Kategori','Keterangan','Pemasukan','Pengeluaran'],
    data.map((t,i)=>[i+1, fmtTgl(t.tanggal), t.kategori, t.keterangan||'-',
      t.jenis==='masuk'?rp(t.jumlah):'-', t.jenis==='keluar'?rp(t.jumlah):'-']),
    ['','TOTAL','','', rp(tm), rp(tk)], un, { tanggal: tglAkhir });
}
